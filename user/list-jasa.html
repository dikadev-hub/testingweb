<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>layanan jasa profesional</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=plus+jakarta+sans:wght@400;600;700;800&display=swap');

        body { 
            background: #f8fafc; color: #1e293b; font-family: 'plus jakarta sans', sans-serif; 
            margin: 0; padding: 0; text-transform: lowercase;
        }

        .header-nav {
            position: sticky; top: 0; background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(20px); padding: 20px; z-index: 100;
            border-bottom: 1px solid #f1f5f9; display: flex; align-items: center; gap: 15px;
        }

        .btn-back {
            width: 38px; height: 38px; background: white; border: 1px solid #e2e8f0;
            border-radius: 12px; display: flex; align-items: center; justify-content: center;
            color: #1e293b; text-decoration: none;
        }

        .container { max-width: 500px; margin: 0 auto; padding: 20px; }
        
        .jasa-grid { display: grid; gap: 16px; }
        
        .card-jasa { 
            background: white; padding: 20px; border-radius: 24px; 
            border: 1px solid #f1f5f9; box-shadow: 0 4px 20px rgba(0,0,0,0.02); 
        }

        /* Seller Profile Section */
        .seller-wrapper { 
            display: flex; align-items: center; gap: 12px; 
            margin-bottom: 15px; padding-bottom: 12px; border-bottom: 1px solid #f8fafc; 
        }
        
        .seller-img { 
            width: 40px; height: 40px; border-radius: 12px; 
            background: #f1f5f9; object-fit: cover; 
        }
        
        .seller-meta { flex: 1; }
        
        .seller-name { 
            font-size: 0.8rem; font-weight: 800; color: #0f172a; 
            display: block; margin-bottom: 2px;
        }
        
        .rating-box { 
            display: flex; align-items: center; gap: 4px; 
            font-size: 0.7rem; font-weight: 700; color: #fbbe24; 
        }
        
        .review-count { color: #94a3b8; font-weight: 500; margin-left: 2px; }

        /* Content Section */
        .cat-label { 
            font-size: 0.6rem; color: #2563eb; font-weight: 800; 
            background: #eff6ff; padding: 4px 10px; border-radius: 8px;
            display: inline-block; text-transform: uppercase;
        }
        
        .jasa-title { 
            margin: 10px 0 6px 0; font-size: 1.1rem; font-weight: 800; 
            color: #0f172a; line-height: 1.3; 
        }
        
        .jasa-desc { 
            font-size: 0.8rem; color: #64748b; line-height: 1.6; 
            margin-bottom: 20px; display: -webkit-box; -webkit-line-clamp: 2;
            -webkit-box-orient: vertical; overflow: hidden;
        }
        
        .footer-card { 
            display: flex; justify-content: space-between; align-items: center; 
            background: #f8fafc; padding: 12px 15px; border-radius: 16px;
        }
        
        .price-text { font-size: 1.1rem; font-weight: 900; color: #0f172a; }
        
        .btn-order { 
            background: #0f172a; color: white; border: none; 
            padding: 10px 18px; border-radius: 12px; font-weight: 800; 
            cursor: pointer; font-size: 0.75rem; 
        }

        #loading-state { text-align: center; padding: 50px; color: #94a3b8; }
    </style>
</head>
<body>

<div class="header-nav">
    <a href="dashboard.html" class="btn-back"><i class="fa-solid fa-chevron-left"></i></a>
    <h1 style="font-size: 1rem; margin: 0; font-weight: 800;">layanan jasa</h1>
</div>

<div class="container">
    <div id="loading-state">memuat layanan...</div>
    <div class="jasa-grid" id="container-jasa"></div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyDGRsCcT-7Bv_nOAybjXyuIT6Ca0IT4YTg",
        databaseURL: "https://market-d978f-default-rtdb.asia-southeast1.firebasedatabase.app",
        projectId: "market-d978f",
    };
    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    function fetchServices() {
        const container = document.getElementById('container-jasa');
        const loading = document.getElementById('loading-state');

        db.ref('services').on('value', async (snap) => {
            loading.style.display = 'none';
            if (!snap.exists()) {
                container.innerHTML = '<p style="text-align:center; color:#94a3b8;">belum ada jasa tersedia.</p>';
                return;
            }

            let html = '';
            const dataJasa = [];
            snap.forEach(child => {
                dataJasa.push({ id: child.key, ...child.val() });
            });

            // Urutkan berdasarkan waktu terbaru
            dataJasa.reverse();

            for (const item of dataJasa) {
                // Ambil data Seller dari node users
                const sellerSnap = await db.ref('users/' + item.ownerToken).get();
                const seller = sellerSnap.val() || {};
                
                const shopName = seller.fullname || "official seller";
                const rating = seller.ratingJasa || "0.0";
                const reviews = seller.totalReviewJasa || "0";
                const photo = seller.foto || `https://ui-avatars.com/api/?name=${shopName}&background=random`;

                html += `
                <div class="card-jasa">
                    <div class="seller-wrapper">
                        <img src="${photo}" class="seller-img" alt="profile">
                        <div class="seller-meta">
                            <span class="seller-name">${shopName}</span>
                            <div class="rating-box">
                                <i class="fa-solid fa-star"></i>
                                <span>${rating}</span>
                                <span class="review-count">(${reviews} ulasan)</span>
                            </div>
                        </div>
                    </div>
                    
                    <span class="cat-label">${item.kategori}</span>
                    <h2 class="jasa-title">${item.nama}</h2>
                    <p class="jasa-desc">${item.deskripsi}</p>
                    
                    <div class="footer-card">
                        <span class="price-text">rp ${item.harga.toLocaleString('id-ID')}</span>
                        <button class="btn-order" onclick="prosesOrder('${item.id}', ${item.harga})">order</button>
                    </div>
                </div>`;
            }
            container.innerHTML = html;
        });
    }

    async function prosesOrder(id, harga) {
        const token = localStorage.getItem('sessionToken');
        if (!token) return alert("silakan login terlebih dahulu.");

        const konfirmasi = confirm("apakah anda yakin ingin memesan jasa ini?");
        if (!konfirmasi) return;

        try {
            const userSnap = await db.ref('users/' + token).get();
            const userData = userSnap.val();
            const saldo = parseInt(userData.balance || 0);

            if (saldo < harga) {
                alert("saldo tidak mencukupi.");
                return;
            }

            // Logika pemotongan saldo dan pembuatan riwayat pembelian
            // (Sama seperti logika pembelian produk, namun dengan type: "jasa")
            alert("sistem order dalam pengembangan. saldo anda: rp " + saldo.toLocaleString());
            
        } catch (e) {
            alert("terjadi kesalahan: " + e.message);
        }
    }

    window.onload = fetchServices;
</script>
</body>
</html>
