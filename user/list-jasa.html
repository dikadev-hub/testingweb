<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>layanan jasa</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=plus+jakarta+sans:wght@400;600;700;800&display=swap');

        body { 
            background: #f8fafc; 
            color: #1e293b; 
            font-family: 'plus jakarta sans', sans-serif; 
            margin: 0; 
            padding: 0; 
            text-transform: lowercase;
        }

        .header-nav {
            position: sticky; 
            top: 0; 
            background: white;
            padding: 20px; 
            z-index: 100; 
            border-bottom: 1px solid #f1f5f9;
            display: flex; 
            align-items: center; 
            gap: 15px;
        }

        .btn-back {
            width: 40px; 
            height: 40px; 
            background: #f1f5f9;
            border-radius: 14px; 
            display: flex; 
            align-items: center; 
            justify-content: center;
            color: #1e293b; 
            text-decoration: none;
        }

        .container { 
            max-width: 500px; 
            margin: 0 auto; 
            padding: 20px; 
        }

        /* Iklan Slider Style */
        .slider-container {
            width: 100%;
            position: relative;
            margin-bottom: 25px;
            display: none;
            overflow: hidden;
        }
        .slider-wrapper {
            display: flex;
            transition: transform 0.5s ease-in-out;
            border-radius: 25px;
        }
        .slide { min-width: 100%; position: relative; }
        .slide img {
            width: 100%;
            height: 160px; 
            object-fit: cover;
            border-radius: 25px;
        }
        .slider-dots {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin-top: 10px;
        }
        .dot {
            width: 8px;
            height: 8px;
            background: #cbd5e1;
            border-radius: 50%;
            transition: 0.3s;
        }
        .dot.active {
            background: #1a1a1a;
            width: 20px;
            border-radius: 10px;
        }

        /* Card Jasa Wide Style */
        .jasa-list-wrapper { 
            display: flex; 
            flex-direction: column; 
            gap: 15px; 
        }

        .card-jasa-wide {
            background: white; 
            padding: 20px; 
            border-radius: 25px;
            border: 1px solid #f1f5f9; 
            display: flex; 
            flex-direction: column;
            box-shadow: 0 4px 15px rgba(0,0,0,0.02);
        }

        .seller-header {
            display: flex; 
            align-items: center; 
            gap: 10px; 
            margin-bottom: 15px;
            padding-bottom: 12px;
            border-bottom: 1px solid #f8fafc;
        }
        .seller-logo {
            width: 35px; 
            height: 35px; 
            border-radius: 10px; 
            background: #f1f5f9;
            object-fit: cover;
        }
        .seller-name { 
            font-size: 0.75rem; 
            font-weight: 800; 
            flex: 1; 
            color: #0f172a;
        }
        .rating-pill {
            background: #fffbeb; 
            color: #fbbe24; 
            padding: 4px 10px; 
            border-radius: 10px;
            font-size: 0.65rem; 
            font-weight: 800; 
            display: flex; 
            align-items: center; 
            gap: 4px;
        }

        .jasa-info-main { margin-bottom: 15px; }
        .jasa-cat { 
            font-size: 0.6rem; 
            color: #2563eb; 
            font-weight: 800; 
            text-transform: uppercase; 
            letter-spacing: 0.5px;
        }
        .jasa-name { 
            font-size: 1rem; 
            font-weight: 800; 
            margin: 4px 0; 
            color: #0f172a; 
        }
        .jasa-desc { 
            font-size: 0.75rem; 
            color: #64748b; 
            line-height: 1.5; 
        }

        .footer-price-row {
            display: flex; 
            align-items: center; 
            justify-content: space-between;
            padding-top: 15px; 
            border-top: 1px solid #f8fafc;
        }
        .price-val { 
            font-size: 1.1rem; 
            font-weight: 900; 
            color: #1e293b; 
        }
        .btn-order-jasa {
            background: #1a1a1a; 
            color: white; 
            border: none; 
            padding: 12px 20px;
            border-radius: 14px; 
            font-weight: 800; 
            font-size: 0.75rem; 
            cursor: pointer;
        }
    </style>
</head>
<body>

<div class="header-nav">
    <a href="dashboard.html" class="btn-back"><i class="fa-solid fa-arrow-left"></i></a>
    <h2 style="font-size: 1rem; margin: 0; font-weight: 900;">layanan jasa</h2>
</div>

<div class="container">
    <div id="slider-container" class="slider-container">
        <div id="slider-wrapper" class="slider-wrapper"></div>
        <div id="slider-dots" class="slider-dots"></div>
    </div>

    <div class="jasa-list-wrapper" id="container-jasa">
        <p style="text-align:center; color:#94a3b8; font-size:0.8rem;">memuat layanan...</p>
    </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyDGRsCcT-7Bv_nOAybjXyuIT6Ca0IT4YTg",
        databaseURL: "https://market-d978f-default-rtdb.asia-southeast1.firebasedatabase.app",
        projectId: "market-d978f",
    };
    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    let currentSlide = 0;
    let slideInterval;

    function initBannerSlider() {
        db.ref('banner_promo').on('value', (snap) => {
            const wrapper = document.getElementById('slider-wrapper');
            const dots = document.getElementById('slider-dots');
            const container = document.getElementById('slider-container');
            wrapper.innerHTML = ""; dots.innerHTML = "";
            
            if (snap.exists()) {
                container.style.display = 'block';
                let i = 0;
                snap.forEach(child => {
                    const d = child.val();
                    wrapper.innerHTML += `
                        <div class="slide">
                            <img src="${d.image_url}">
                        </div>`;
                    dots.innerHTML += `<div class="dot ${i === 0 ? 'active' : ''}" onclick="goToSlide(${i})"></div>`;
                    i++;
                });
                startAutoSlide();
            } else {
                container.style.display = 'none';
            }
        });
    }

    function goToSlide(n) {
        const wrapper = document.getElementById('slider-wrapper');
        const dots = document.querySelectorAll('.dot');
        const totalSlides = dots.length;
        if (n >= totalSlides) n = 0;
        if (n < 0) n = totalSlides - 1;
        currentSlide = n;
        wrapper.style.transform = `translateX(-${n * 100}%)`;
        dots.forEach(d => d.classList.remove('active'));
        if(dots[n]) dots[n].classList.add('active');
    }

    function startAutoSlide() { 
        if(slideInterval) clearInterval(slideInterval); 
        slideInterval = setInterval(() => goToSlide(currentSlide + 1), 4000); 
    }

    function loadJasa() {
        db.ref('services').on('value', async (snap) => {
            const container = document.getElementById('container-jasa');
            let html = '';
            
            if(!snap.exists()) {
                container.innerHTML = '<p style="text-align:center; color:#94a3b8; font-size:0.8rem;">belum ada jasa tersedia.</p>';
                return;
            }

            const services = [];
            snap.forEach(child => { services.push({key: child.key, ...child.val()}); });
            services.reverse();

            for (const j of services) {
                const sellerSnap = await db.ref('users/' + j.ownerToken).get();
                const seller = sellerSnap.val() || {};
                const shopName = seller.fullname || "official seller";
                const photo = seller.foto || `https://ui-avatars.com/api/?name=${shopName}&background=random`;
                const rating = seller.ratingJasa || "0.0";

                html += `
                <div class="card-jasa-wide">
                    <div class="seller-header">
                        <img src="${photo}" class="seller-logo">
                        <span class="seller-name">${shopName}</span>
                        <div class="rating-pill">
                            <i class="fa-solid fa-star"></i> ${rating}
                        </div>
                    </div>
                    
                    <div class="jasa-info-main">
                        <span class="jasa-cat">${j.kategori}</span>
                        <h3 class="jasa-name">${j.nama}</h3>
                        <p class="jasa-desc">${j.deskripsi}</p>
                    </div>
                    
                    <div class="footer-price-row">
                        <span class="price-val">rp ${j.harga.toLocaleString('id-ID')}</span>
                        <button class="btn-order-jasa" onclick="orderJasa('${j.key}', ${j.harga})">pesan</button>
                    </div>
                </div>`;
            }
            container.innerHTML = html;
        });
    }

     async function orderJasa(id, harga) {
    const token = localStorage.getItem('sessionToken');
    if (!token) {
        alert("silakan login terlebih dahulu.");
        window.location.href = 'login.html';
        return;
    }

    const konfirmasi = confirm("apakah anda yakin ingin memesan jasa ini?");
    if (!konfirmasi) return;

    try {
        const userRef = db.ref('users/' + token);
        const userSnap = await userRef.get();
        
        if (!userSnap.exists()) return alert("data user tidak ditemukan.");
        
        const userData = userSnap.val();
        const saldoSekarang = parseInt(userData.balance || 0);
        const hargaJasa = parseInt(harga);

        if (saldoSekarang < hargaJasa) {
            alert("saldo tidak mencukupi untuk memesan jasa ini.");
            return;
        }

        const jasaRef = db.ref('services/' + id);
        const jasaSnap = await jasaRef.get();
        const dataJasa = jasaSnap.val();

        // Ambil data seller untuk mendapatkan nama toko sesuai DB
        const sellerRef = db.ref('users/' + dataJasa.ownerToken);
        const sellerSnap = await sellerRef.get();
        const dataSeller = sellerSnap.val() || {};
        
        // Nama toko diambil dari field fullname milik seller
        const namaTokoDb = dataSeller.fullname || "official store";

        const orderId = "order-js-" + Date.now();
        const updates = {};

        updates['users/' + token + '/balance'] = saldoSekarang - hargaJasa;

        updates['pembelian/' + orderId] = {
            orderId: orderId,
            userToken: token,
            namaPembeli: userData.fullname || "pembeli",
            productId: id,
            nama: dataJasa.nama,
            kategori: dataJasa.kategori,
            total: hargaJasa,
            status: "sukses",
            type: "jasa",
            ownerToken: dataJasa.ownerToken,
            namaToko: namaTokoDB,
            timestamp: Date.now()
        };

        await db.ref().update(updates);
        
        alert("pemesanan jasa berhasil! silakan isi formulir di riwayat.");
        window.location.href = 'riwayat-user.html';

    } catch (e) {
        alert("terjadi kesalahan: " + e.message);
    }
}

    window.onload = () => {
        initBannerSlider();
        loadJasa();
    };
</script>
</body>
</html>
