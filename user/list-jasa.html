<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>layanan jasa</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=plus+jakarta+sans:wght@400;600;700;800&display=swap');

        body { 
            background: #f8fafc; color: #1e293b; font-family: 'plus jakarta sans', sans-serif; 
            margin: 0; padding: 0; text-transform: lowercase; overflow-x: hidden;
        }

        /* Navigasi Atas - Clean Look */
        .header-nav {
            position: sticky; top: 0; background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px); padding: 15px 20px; z-index: 1000;
            border-bottom: 1px solid #f1f5f9; display: flex; 
            align-items: center; justify-content: space-between;
        }

        .btn-back {
            width: 40px; height: 40px; background: #f1f5f9; border-radius: 14px;
            display: flex; align-items: center; justify-content: center;
            color: #1e293b; text-decoration: none;
        }

        /* Iklan Full Lebar - Tanpa Margin Sama Sekali */
        .slider-container {
            width: 100vw; height: 260px; position: relative; 
            display: none; overflow: hidden; background: #000;
        }
        .slider-wrapper {
            display: flex; height: 100%;
            transition: transform 0.8s cubic-bezier(0.2, 1, 0.2, 1);
        }
        .slide { min-width: 100vw; position: relative; }
        .slide img { 
            width: 100%; height: 100%; object-fit: cover; opacity: 0.8;
        }
        
        .slide-overlay {
            position: absolute; bottom: 0; left: 0; right: 0;
            height: 50%; background: linear-gradient(to top, rgba(0,0,0,0.8), transparent);
            display: flex; align-items: flex-end; padding: 25px;
        }
        .slide-title { color: white; font-size: 1.2rem; font-weight: 800; margin: 0; }

        .slider-dots {
            position: absolute; bottom: 20px; right: 20px;
            display: flex; gap: 6px;
        }
        .dot { width: 6px; height: 6px; background: rgba(255,255,255,0.4); border-radius: 50%; transition: 0.4s; }
        .dot.active { background: #fff; width: 20px; border-radius: 10px; }

        .container { max-width: 500px; margin: 0 auto; padding: 25px 20px; }

        /* Provider Scroll - Lingkaran Modern */
        .provider-list {
            display: flex; gap: 15px; overflow-x: auto; 
            padding-bottom: 20px; scrollbar-width: none;
        }
        .provider-list::-webkit-scrollbar { display: none; }
        
        .p-card {
            display: flex; flex-direction: column; align-items: center; min-width: 70px; cursor: pointer;
        }
        .p-avatar {
            width: 60px; height: 60px; border-radius: 50%; padding: 3px;
            border: 2px solid transparent; transition: 0.3s;
        }
        .p-card.active .p-avatar { border-color: #1e293b; }
        .p-avatar img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; }
        .p-name { font-size: 0.65rem; font-weight: 800; color: #94a3b8; margin-top: 8px; text-align: center; }
        .p-card.active .p-name { color: #1e293b; }

        /* List Jasa - Card Minimalis */
        .jasa-grid { display: flex; flex-direction: column; gap: 15px; }
        .card-jasa {
            background: white; border-radius: 25px; padding: 20px;
            border: 1px solid #f1f5f9; box-shadow: 0 4px 15px rgba(0,0,0,0.02);
            position: relative;
        }
        
        .badge-rating {
            position: absolute; top: 20px; right: 20px;
            background: #fffbeb; color: #fbbe24; padding: 4px 10px;
            border-radius: 10px; font-size: 0.7rem; font-weight: 800;
            display: flex; align-items: center; gap: 4px;
        }

        .jasa-cat { font-size: 0.6rem; color: #3b82f6; font-weight: 800; text-transform: uppercase; }
        .jasa-title { font-size: 1rem; font-weight: 800; margin: 8px 0; color: #1e293b; }
        
        .seller-info { display: flex; align-items: center; gap: 6px; margin-bottom: 15px; }
        .seller-info img { width: 18px; height: 18px; border-radius: 50%; }
        .seller-info span { font-size: 0.7rem; font-weight: 600; color: #94a3b8; }

        .jasa-footer {
            display: flex; align-items: center; justify-content: space-between;
            padding-top: 15px; border-top: 1px solid #f8fafc;
        }
        .price { font-size: 1.1rem; font-weight: 900; color: #1e293b; }
        .btn-order {
            padding: 10px 22px; background: #1e293b; color: white; border: none;
            border-radius: 12px; font-weight: 800; font-size: 0.75rem; cursor: pointer;
        }

        #loading-state { text-align: center; padding: 30px; color: #cbd5e1; }
    </style>
</head>
<body>

<div class="header-nav">
    <a href="dashboard.html" class="btn-back"><i class="fa-solid fa-arrow-left"></i></a>
    <h2 style="font-size: 0.9rem; margin: 0; font-weight: 800;">layanan market</h2>
    <div style="width: 40px;"></div>
</div>

<div id="slider-container" class="slider-container">
    <div id="slider-wrapper" class="slider-wrapper"></div>
    <div id="slider-dots" class="slider-dots"></div>
</div>

<div class="container">
    <div class="provider-list" id="list-provider">
        <div class="p-card active" onclick="filterJasa('all', this)">
            <div class="p-avatar" style="display:flex; align-items:center; justify-content:center; background:#f1f5f9;">
                <i class="fa-solid fa-grid-2" style="font-size:1.2rem;"></i>
            </div>
            <span class="p-name">semua</span>
        </div>
    </div>

    <div id="loading-state"><i class="fa-solid fa-spinner fa-spin"></i></div>
    <div class="jasa-grid" id="container-jasa"></div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyDGRsCcT-7Bv_nOAybjXyuIT6Ca0IT4YTg",
        databaseURL: "https://market-d978f-default-rtdb.asia-southeast1.firebasedatabase.app",
        projectId: "market-d978f",
    };
    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    let allJasa = [];
    let sellers = {};
    let currentSlide = 0;

    function initBanner() {
        db.ref('banner_promo').on('value', (snap) => {
            const wrapper = document.getElementById('slider-wrapper');
            const dots = document.getElementById('slider-dots');
            const container = document.getElementById('slider-container');
            if (!snap.exists()) return;
            
            container.style.display = 'block';
            let html = '', dotHtml = '', i = 0;
            snap.forEach(child => {
                const d = child.val();
                html += `<div class="slide"><img src="${d.image_url}"><div class="slide-overlay"><h3 class="slide-title">${d.title || 'promo hari ini'}</h3></div></div>`;
                dotHtml += `<div class="dot ${i === 0 ? 'active' : ''}" onclick="goToSlide(${i})"></div>`;
                i++;
            });
            wrapper.innerHTML = html; dots.innerHTML = dotHtml;
            setInterval(() => { currentSlide++; goToSlide(currentSlide); }, 4500);
        });
    }

    function goToSlide(n) {
        const wrapper = document.getElementById('slider-wrapper');
        const dots = document.querySelectorAll('.dot');
        if (n >= dots.length) currentSlide = 0;
        else currentSlide = n;
        wrapper.style.transform = `translateX(-${currentSlide * 100}vw)`;
        dots.forEach((d, i) => d.classList.toggle('active', i === currentSlide));
    }

    async function loadData() {
        db.ref('services').on('value', async (snap) => {
            document.getElementById('loading-state').style.display = 'none';
            if(!snap.exists()) return;
            
            allJasa = [];
            let pIds = new Set();
            snap.forEach(c => {
                const d = c.val();
                allJasa.push({ id: c.key, ...d });
                pIds.add(d.ownerToken);
            });

            const providerCont = document.getElementById('list-provider');
            for (let token of pIds) {
                const uSnap = await db.ref('users/' + token).get();
                if (uSnap.exists()) {
                    const u = uSnap.val();
                    sellers[token] = {
                        name: u.fullname,
                        photo: u.foto || `https://ui-avatars.com/api/?name=${u.fullname}&background=random`,
                        rating: parseFloat(u.ratingJasa || 0)
                    };
                    
                    const pItem = document.createElement('div');
                    pItem.className = 'p-card';
                    pItem.onclick = () => filterJasa(token, pItem);
                    pItem.innerHTML = `<div class="p-avatar"><img src="${sellers[token].photo}"></div><span class="p-name">${sellers[token].name}</span>`;
                    providerCont.appendChild(pItem);
                }
            }

            // Sorting otomatis berdasarkan rating tertinggi
            allJasa.sort((a, b) => (sellers[b.ownerToken]?.rating || 0) - (sellers[a.ownerToken]?.rating || 0));
            renderJasa(allJasa);
        });
    }

    function renderJasa(data) {
        const container = document.getElementById('container-jasa');
        container.innerHTML = "";
        data.forEach(j => {
            const s = sellers[j.ownerToken];
            container.innerHTML += `
                <div class="card-jasa">
                    ${s.rating > 0 ? `<div class="badge-rating"><i class="fa-solid fa-star"></i> ${s.rating.toFixed(1)}</div>` : ''}
                    <span class="jasa-cat">${j.kategori}</span>
                    <h3 class="jasa-title">${j.nama}</h3>
                    <div class="seller-info">
                        <img src="${s.photo}">
                        <span>${s.name}</span>
                    </div>
                    <div class="jasa-footer">
                        <span class="price">rp ${j.harga.toLocaleString('id-ID')}</span>
                        <button class="btn-order" onclick="orderJasa('${j.id}', ${j.harga})">pesan</button>
                    </div>
                </div>`;
        });
    }

    function filterJasa(token, el) {
        document.querySelectorAll('.p-card').forEach(c => c.classList.remove('active'));
        el.classList.add('active');
        if(token === 'all') renderJasa(allJasa);
        else renderJasa(allJasa.filter(j => j.ownerToken === token));
    }

    async function orderJasa(id, harga) {
        const token = localStorage.getItem('sessionToken');
        if (!token) return alert("silakan login.");
        if (!confirm("lanjut ke pembayaran?")) return;

        try {
            const uRef = db.ref('users/' + token);
            const uSnap = await uRef.get();
            const saldo = parseInt(uSnap.val().balance || 0);

            if (saldo < harga) return alert("saldo tidak cukup.");

            const jData = (await db.ref('services/' + id).get()).val();
            const orderId = "order-js-" + Date.now();
            const updates = {};
            updates['users/' + token + '/balance'] = saldo - harga;
            updates['pembelian/' + orderId] = {
                orderId, userToken: token, namaPembeli: uSnap.val().fullname,
                productId: id, nama: jData.nama, total: harga, status: "sukses", 
                type: "jasa", ownerToken: jData.ownerToken, timestamp: Date.now()
            };
            await db.ref().update(updates);
            location.href = 'riwayat-user.html';
        } catch (e) { alert(e.message); }
    }

    window.onload = () => { initBanner(); loadData(); };
</script>
</body>
</html>
