<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Penambahan Produk</title>
    <script src="../setting.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.1/cropper.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.1/cropper.min.js"></script>
    <style>
        body { 
            background: #f0f4f8; color: #1a1a1a; font-family: 'Inter', sans-serif; 
            margin: 0; padding: 20px; text-transform: lowercase;
            padding-bottom: 80px;
        }
        .container { max-width: 500px; margin: 0 auto; }
        .card { background: white; padding: 25px; border-radius: 25px; box-shadow: 0 10px 30px rgba(0,0,0,0.03); }
        .header { display: flex; align-items: center; gap: 15px; margin-bottom: 25px; }
        .btn-back { width: 40px; height: 40px; border-radius: 12px; border: 1px solid #e2e8f0; display: flex; align-items: center; justify-content: center; color: #1a1a1a; text-decoration: none; background: white; }
        label { display: block; font-size: 0.65rem; font-weight: 800; color: #94a3b8; text-transform: uppercase; margin-bottom: 8px; letter-spacing: 0.5px; margin-top: 10px; }
        input, textarea, select { 
            width: 100%; padding: 15px; border-radius: 15px; border: 1px solid #e2e8f0; 
            background: #f8fafc; outline: none; font-family: inherit; box-sizing: border-box; 
            margin-bottom: 15px; font-weight: 600; font-size: 0.85rem; transition: 0.3s;
        }
        input:focus, select:focus, textarea:focus { border-color: #007bff; background: white; }
        .upload-wrapper {
            width: 100%; aspect-ratio: 1/1; border: 2px dashed #e2e8f0; border-radius: 20px;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; position: relative; overflow: hidden; background: #f8fafc;
            margin-bottom: 20px;
        }
        #final-preview { width: 100%; height: 100%; object-fit: cover; display: none; position: absolute; top: 0; left: 0; }
        .upload-placeholder { text-align: center; color: #94a3b8; font-size: 0.8rem; font-weight: 600; }
        .upload-placeholder i { font-size: 2rem; color: #007bff; margin-bottom: 10px; }
        .secret-box { background: #fff5f5; border: 1px solid #feb2b2; padding: 20px; border-radius: 20px; margin-top: 15px; margin-bottom: 20px; }
        .secret-box h4 { margin: 0 0 15px 0; font-size: 0.75rem; color: #c53030; text-transform: uppercase; display: flex; align-items: center; gap: 8px; }
        .action-area { position: fixed; bottom: 0; left: 0; width: 100%; background: rgba(240, 244, 248, 0.9); backdrop-filter: blur(10px); padding: 15px 20px 20px; box-sizing: border-box; z-index: 100; }
        .btn-submit { width: 100%; max-width: 460px; margin: 0 auto; display: block; padding: 18px; background: #1a1a1a; color: white; border: none; border-radius: 15px; font-weight: 800; cursor: pointer; transition: 0.3s; text-transform: uppercase; font-size: 0.85rem; }
        .btn-submit:disabled { background: #cbd5e1; cursor: not-allowed; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <a href="dashboard.html" class="btn-back"><i class="fa-solid fa-arrow-left"></i></a>
        <h2 style="font-size: 1rem; margin: 0; font-weight: 900;">ajukan produk baru</h2>
    </div>

    <div class="card">
        <label>foto produk (auto crop 1:1) :</label>
        <div class="upload-wrapper" onclick="document.getElementById('file-input').click()">
            <img id="final-preview">
            <div id="placeholder-content" class="upload-placeholder">
                <i class="fa-solid fa-cloud-arrow-up"></i>
                <br>pilih foto
            </div>
            <input type="file" id="file-input" accept="image/jpeg, image/png" style="display: none;" onchange="prosesFotoOtomatis(this)">
        </div>

        <label>nama produk :</label>
        <input type="text" id="nama-produk" placeholder="nama produk">

        <label>kategori :</label>
        <select id="kategori-produk">
            <option value="AKUN">AKUN</option>
            <option value="APP PREM">APP PREM</option>
            <option value="E-BOOK">E-BOOK</option>
            <option value="PRODUK DIGITAL">PRODUK DIGITAL</option>
            <option value="LAIN NYA">LAIN NYA</option>
        </select>

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px;">
            <div>
                <label>stok tersedia :</label>
                <input type="number" id="stok-produk">
            </div>
            <div>
                <label>id (otomatis) :</label>
                <input type="text" id="id-produk" readonly style="background: #e2e8f0;">
            </div>
        </div>

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px;">
            <div>
                <label>harga awal (rp) :</label>
                <input type="number" id="harga-awal" oninput="hitungHargaFinal()">
            </div>
            <div>
                <label>diskon (%) :</label>
                <input type="number" id="persen-diskon" oninput="hitungHargaFinal()">
            </div>
        </div>

        <label>harga jual akhir :</label>
        <input type="number" id="harga-final" readonly style="background: #e2e8f0; color: #007bff; font-weight: 800;">

        <label>deskripsi produk :</label>
        <textarea id="desc-produk" rows="4"></textarea>

        <div class="secret-box">
            <h4><i class="fa-solid fa-lock"></i> data akun rahasia</h4>
            <label>email / username :</label>
            <input type="text" id="email-akun">
            <label>kata sandi :</label>
            <input type="text" id="pass-akun">
            <label>status a2f :</label>
            <select id="a2f-status">
                <option value="OFF">OFF</option>
                <option value="ON">ON</option>
            </select>
            <label>informasi tambahan :</label>
            <textarea id="extra-info" rows="2"></textarea>
        </div>
    </div>
</div>

<div class="action-area">
    <button class="btn-submit" id="btn-save" onclick="ajukanProduk()">kirim pengajuan</button>
</div>

<div style="display:none;">
    <img id="temp-image">
</div>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyDGRsCcT-7Bv_nOAybjXyuIT6Ca0IT4YTg",
        databaseURL: "https://market-d978f-default-rtdb.asia-southeast1.firebasedatabase.app",
        projectId: "market-d978f",
    };
    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    const ownerName = localStorage.getItem('fullname') || 'owner';
    const ownerToken = localStorage.getItem('userToken');
    const randomID = "PRD-" + Date.now().toString().slice(-4) + Math.floor(1000 + Math.random() * 9000);

    let finalBlob = null;

    window.onload = function() {
        document.getElementById('id-produk').value = randomID;
    };

    function prosesFotoOtomatis(input) {
        if (input.files && input.files[0]) {
            const reader = new FileReader();
            reader.onload = function(e) {
                const img = document.getElementById('temp-image');
                img.src = e.result;
                img.onload = function() {
                    const cropper = new Cropper(img, {
                        aspectRatio: 1,
                        viewMode: 1,
                        autoCropArea: 1,
                        ready() {
                            cropper.getCroppedCanvas({ width: 600, height: 600 }).toBlob((blob) => {
                                finalBlob = blob;
                                const preview = document.getElementById('final-preview');
                                preview.src = URL.createObjectURL(blob);
                                preview.style.display = 'block';
                                document.getElementById('placeholder-content').style.display = 'none';
                                cropper.destroy();
                            }, 'image/jpeg', 0.9);
                        }
                    });
                };
            }
            reader.readAsDataURL(input.files[0]);
        }
    }

    function hitungHargaFinal() {
        const awal = parseFloat(document.getElementById('harga-awal').value) || 0;
        const diskon = parseFloat(document.getElementById('persen-diskon').value) || 0;
        const final = document.getElementById('harga-final');
        if (awal > 0) {
            const potongan = (awal * diskon) / 100;
            final.value = Math.round(awal - potongan);
        } else {
            final.value = "";
        }
    }

    async function ajukanProduk() {
        const btn = document.getElementById('btn-save');
        const nama = document.getElementById('nama-produk').value.trim();
        const stok = document.getElementById('stok-produk').value;
        const hargaJual = document.getElementById('harga-final').value;
        const email = document.getElementById('email-akun').value.trim();
        const pass = document.getElementById('pass-akun').value.trim();

        if(!finalBlob || !nama || !stok || !hargaJual || !email || !pass) return alert("lengkapi semua data");

        btn.disabled = true;
        btn.innerText = "mengirim...";

        try {
            const userRef = db.ref('users/' + ownerToken);
            const userSnap = await userRef.get();
            const currentLimit = userSnap.val()?.saleLimit || 0;

            if (currentLimit <= 0) {
                alert("limit upload kamu sudah habis!");
                btn.disabled = false;
                btn.innerText = "kirim pengajuan";
                return;
            }

            const formData = new FormData();
            formData.append("image", finalBlob, "produk.jpg");
            const resImg = await fetch("https://api.imgbb.com/1/upload?key=50145b1eaa1385c3d9549ebe496eb5b5", {
                method: "POST",
                body: formData
            }).then(r => r.json());

            if(resImg.success) {
                await userRef.child('saleLimit').transaction((current) => {
                    return (current || 0) - 1;
                });

                await db.ref('pending_products').push({
                    productId: randomID,
                    nama: nama,
                    kategori: document.getElementById('kategori-produk').value,
                    foto: resImg.data.url,
                    stok: parseInt(stok),
                    hargaAwal: parseInt(document.getElementById('harga-awal').value || hargaJual),
                    diskon: parseInt(document.getElementById('persen-diskon').value || 0),
                    harga: parseInt(hargaJual),
                    deskripsi: document.getElementById('desc-produk').value,
                    uploadBy: ownerName,
                    ownerToken: ownerToken,
                    akun: {
                        email: email,
                        pass: pass,
                        a2f: document.getElementById('a2f-status').value,
                        tambahan: document.getElementById('extra-info').value
                    },
                    status: "pending",
                    timestamp: Date.now()
                });
                alert("berhasil diajukan");
                window.location.href = 'dashboard.html';
            }
        } catch (e) {
            alert("error sistem");
            btn.disabled = false;
            btn.innerText = "kirim pengajuan";
        }
    }
</script>
</body>
</html>
