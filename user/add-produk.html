<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>add produk owner</title>
    <script src="../setting.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        body { 
            background: #f0f4f8; color: #1a1a1a; font-family: 'inter', sans-serif; 
            margin: 0; padding: 20px; text-transform: lowercase;
        }
        .container { max-width: 500px; margin: 0 auto; }
        .card { background: white; padding: 25px; border-radius: 25px; box-shadow: 0 10px 30px rgba(0,0,0,0.03); }
        .header { display: flex; align-items: center; gap: 15px; margin-bottom: 25px; }
        .btn-back { width: 40px; height: 40px; border-radius: 12px; border: 1px solid #e2e8f0; display: flex; align-items: center; justify-content: center; color: #1a1a1a; text-decoration: none; }
        
        label { display: block; font-size: 0.65rem; font-weight: 800; color: #94a3b8; text-transform: uppercase; margin-bottom: 8px; }
        input, textarea, select { width: 100%; padding: 15px; border-radius: 15px; border: 1px solid #e2e8f0; background: #f8fafc; outline: none; font-family: inherit; box-sizing: border-box; margin-bottom: 15px; font-weight: 600; }
        
        .upload-area { border: 2px dashed #e2e8f0; border-radius: 15px; padding: 20px; text-align: center; cursor: pointer; margin-bottom: 20px; }
        .upload-area:hover { border-color: #007bff; }
        #preview-img { width: 100%; border-radius: 12px; display: none; margin-bottom: 15px; }

        .secret-box { background: #fff5f5; border: 1px solid #feb2b2; padding: 15px; border-radius: 15px; margin-top: 10px; }
        .secret-box h4 { margin: 0 0 10px 0; font-size: 0.7rem; color: #c53030; text-transform: uppercase; }

        .btn-submit { width: 100%; padding: 18px; background: #1a1a1a; color: white; border: none; border-radius: 15px; font-weight: 800; cursor: pointer; transition: 0.3s; }
        .btn-submit:disabled { background: #cbd5e1; cursor: not-allowed; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <a href="dashboard.html" class="btn-back"><i class="fa-solid fa-arrow-left"></i></a>
        <h2 style="font-size: 1rem; margin: 0;">tambah produk baru</h2>
    </div>

    <div class="card">
        <label>foto produk :</label>
        <div class="upload-area" onclick="document.getElementById('foto-input').click()">
            <img id="preview-img">
            <div id="upload-label"><i class="fa-solid fa-cloud-arrow-up"></i><br>klik untuk upload foto</div>
            <input type="file" id="foto-input" accept="image/*" style="display: none;" onchange="previewFile()">
        </div>

        <label>nama produk :</label>
        <input type="text" id="nama-produk" placeholder="masukkan nama produk">

        <label>id produk (otomatis) :</label>
        <input type="text" id="id-produk" readonly>

        <label>upload by :</label>
        <input type="text" id="upload-by" readonly>

        <label>harga :</label>
        <input type="number" id="harga-produk" placeholder="cth: 50000">

        <label>deskripsi :</label>
        <textarea id="desc-produk" rows="3" placeholder="jelaskan produk lo"></textarea>

        <div class="secret-box">
            <h4>data akun (muncul setelah dibeli)</h4>
            <label>email :</label>
            <input type="text" id="email-akun" placeholder="email/username">
            
            <label>password :</label>
            <input type="text" id="pass-akun" placeholder="password">

            <label>a2f status :</label>
            <select id="a2f-status">
                <option value="OFF">OFF</option>
                <option value="ON">ON</option>
            </select>

            <label>tambahan info :</label>
            <textarea id="extra-info" rows="2" placeholder="kode a2f atau info lain"></textarea>
        </div>

        <button class="btn-submit" id="btn-save" onclick="requestUpload()">ajukan persetujuan admin</button>
    </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyDGRsCcT-7Bv_nOAybjXyuIT6Ca0IT4YTg",
        databaseURL: "https://market-d978f-default-rtdb.asia-southeast1.firebasedatabase.app",
        projectId: "market-d978f",
    };
    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    // SETUP AWAL
    const userFullname = localStorage.getItem('fullname') || 'owner';
    const userToken = localStorage.getItem('userToken');
    const genID = "PRD-" + Math.floor(1000 + Math.random() * 9000);

    document.getElementById('id-produk').value = genID;
    document.getElementById('upload-by').value = userFullname;

    function previewFile() {
        const preview = document.getElementById('preview-img');
        const label = document.getElementById('upload-label');
        const file = document.getElementById('foto-input').files[0];
        const reader = new FileReader();
        reader.onloadend = () => { preview.src = reader.result; preview.style.display = 'block'; label.style.display = 'none'; }
        if (file) reader.readAsDataURL(file);
    }

    async function requestUpload() {
        const btn = document.getElementById('btn-save');
        const file = document.getElementById('foto-input').files[0];
        
        // Data Basic
        const nama = document.getElementById('nama-produk').value;
        const harga = document.getElementById('harga-produk').value;
        const desc = document.getElementById('desc-produk').value;
        
        // Data Rahasia
        const email = document.getElementById('email-akun').value;
        const pass = document.getElementById('pass-akun').value;
        const a2f = document.getElementById('a2f-status').value;
        const extra = document.getElementById('extra-info').value;

        if(!file || !nama || !harga || !email || !pass) return alert("lengkapi semua data koo!");

        btn.disabled = true;
        btn.innerText = "mengirim data...";

        try {
            // 1. Upload ke ImgBB
            const formData = new FormData();
            formData.append("image", file);
            const res = await fetch("https://api.imgbb.com/1/upload?key=50145b1eaa1385c3d9549ebe496eb5b5", {
                method: "POST",
                body: formData
            }).then(r => r.json());

            if(res.success) {        
                await db.ref('pending_products').push({
                    productId: genID,
                    nama: nama,
                    harga: parseInt(harga),
                    deskripsi: desc,
                    foto: res.data.url,
                    uploadBy: userFullname,
                    ownerToken: userToken,
                    akun: {
                        email: email,
                        pass: pass,
                        a2f: a2f,
                        tambahan: extra
                    },
                    status: "pending",
                    timestamp: Date.now()
                });

                alert("produk dikirim! tunggu persetujuan admin ya.");
                location.href = 'dashboard.html';
            }
        } catch (e) {
            alert("gagal upload koo");
            btn.disabled = false;
            btn.innerText = "ajukan persetujuan admin";
        }
    }
</script>
</body>
</html>
