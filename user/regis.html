<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="page-title">daftar akun</title>
    <script src="setting.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        body { 
            background: #f8fafc; 
            font-family: 'inter', sans-serif; 
            margin: 0; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            height: 100vh;
            text-transform: lowercase;
        }
        .register-box {
            background: white;
            padding: 30px;
            border-radius: 25px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            width: 90%;
            max-width: 350px;
            border: 1px solid #e2e8f0;
        }
        .register-box h2 { 
            margin-bottom: 20px; 
            font-weight: 900; 
            color: #16a34a; 
            text-align: center;
        }
        .input-group { margin-bottom: 15px; }
        .input-group label { 
            display: block; 
            font-size: 0.75rem; 
            font-weight: 800; 
            color: #64748b; 
            margin-bottom: 5px; 
        }
        .input-group input {
            width: 100%;
            padding: 12px;
            border-radius: 12px;
            border: 1px solid #e2e8f0;
            box-sizing: border-box;
            font-family: inherit;
            background: #f1f5f9;
        }
        .btn-register {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 12px;
            background: #16a34a;
            color: white;
            font-weight: 800;
            cursor: pointer;
            margin-top: 10px;
        }
        .login-link {
            text-align: center;
            margin-top: 15px;
            font-size: 0.8rem;
            color: #64748b;
        }
        .login-link a { color: #16a34a; text-decoration: none; font-weight: 700; }
    </style>
</head>
<body>

<div class="register-box">
    <h2 class="shop-name">market</h2>
    
    <div class="input-group">
        <label>nama lengkap</label>
        <input type="text" id="reg-name" placeholder="masukkan nama">
    </div>

    <div class="input-group">
        <label>email aktif</label>
        <input type="email" id="reg-email" placeholder="email@gmail.com">
    </div>

    <div class="input-group">
        <label>nomor whatsapp</label>
        <input type="number" id="reg-phone" placeholder="08xxxx">
    </div>

    <div class="input-group">
        <label>password</label>
        <input type="password" id="reg-pass" placeholder="minimal 6 digit">
    </div>

    <button class="btn-register" onclick="handleRegister()">daftar sekarang</button>

    <div class="login-link">
        sudah punya akun? <a href="login.html">login</a>
    </div>
</div>

<script>
    async function handleRegister() {
        const name = document.getElementById('reg-name').value;
        const email = document.getElementById('reg-email').value;
        const phone = document.getElementById('reg-phone').value;
        const pass = document.getElementById('reg-pass').value;

        if (!name || !email || !phone || !pass) {
            return alert("semua data wajib diisi kak");
        }

        const btn = document.querySelector('.btn-register');
        btn.innerText = "loading...";
        btn.disabled = true;

        try {
            const response = await fetch('/api/register', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ name, email, phone, pass })
            });

            const result = await response.json();

            if (response.ok) {
                localStorage.setItem('sessionToken', result.sessionToken);
                alert("pendaftaran berhasil!");
                window.location.href = "dashboard.html";
            } else {
                alert(result.message);
                btn.innerText = "daftar sekarang";
                btn.disabled = false;
            }
        } catch (e) {
            alert("gagal terhubung ke server");
            btn.innerText = "daftar sekarang";
            btn.disabled = false;
        }
    }

    window.onload = function() {
        if (window.settings) {
            document.querySelectorAll('.shop-name').forEach(el => el.innerText = settings.namatoko);
        }
    };
</script>

</body>
</html>
