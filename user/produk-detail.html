<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detail Produk</title>
    <script src="../setting.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        body { 
            background: #f0f4f8; color: #1a1a1a; font-family: 'Inter', sans-serif; 
            margin: 0; padding: 0; text-transform: lowercase;
        }
        .header-detail {
            position: fixed; top: 20px; left: 20px; z-index: 100;
        }
        .btn-back {
            width: 45px; height: 45px; background: white; border-radius: 15px;
            display: flex; align-items: center; justify-content: center;
            color: #1a1a1a; text-decoration: none; box-shadow: 0 10px 20px rgba(0,0,0,0.05);
        }
        .product-image {
            width: 100%; aspect-ratio: 1/1; object-fit: cover; background: #ddd;
        }
        .content-detail {
            background: white; border-radius: 30px 30px 0 0;
            margin-top: -30px; position: relative; padding: 30px 25px 120px;
            min-height: 50vh; box-shadow: 0 -10px 30px rgba(0,0,0,0.03);
        }
        .category-tag {
            display: inline-block; padding: 6px 12px; background: #f0f7ff;
            color: #007bff; border-radius: 8px; font-size: 0.65rem;
            font-weight: 800; text-transform: uppercase; margin-bottom: 15px;
        }
        .product-name {
            font-size: 1.4rem; font-weight: 900; margin: 0 0 10px; line-height: 1.2;
        }
        .product-price {
            font-size: 1.2rem; font-weight: 900; color: #007bff; margin-bottom: 25px;
        }
        .section-title {
            font-size: 0.7rem; font-weight: 800; color: #94a3b8;
            text-transform: uppercase; margin-bottom: 10px; display: block;
            letter-spacing: 1px;
        }
        .product-description {
            font-size: 0.9rem; line-height: 1.6; color: #475569; margin-bottom: 30px;
            white-space: pre-wrap;
        }
        .footer-action {
            position: fixed; bottom: 0; left: 0; width: 100%;
            background: white; padding: 20px; box-sizing: border-box;
            display: flex; gap: 12px; border-top: 1px solid #f1f5f9;
            box-shadow: 0 -10px 30px rgba(0,0,0,0.02);
        }
        .btn-cart {
            flex: 1; padding: 18px; border-radius: 18px; border: 2px solid #1a1a1a;
            background: transparent; color: #1a1a1a; font-weight: 800;
            font-size: 0.75rem; cursor: pointer; text-transform: uppercase;
        }
        .btn-buy {
            flex: 1.5; padding: 18px; border-radius: 18px; border: none;
            background: #1a1a1a; color: white; font-weight: 800;
            font-size: 0.75rem; cursor: pointer; text-transform: uppercase;
        }
        #loading-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: white; z-index: 1000; display: flex;
            align-items: center; justify-content: center;
        }
    </style>
</head>
<body>

<div id="loading-overlay"><i class="fa-solid fa-circle-notch fa-spin" style="font-size: 2rem; color: #007bff;"></i></div>

<div class="header-detail">
    <a href="dashboard.html" class="btn-back"><i class="fa-solid fa-arrow-left"></i></a>
</div>

<img id="det-foto" class="product-image" src="" alt="">

<div class="content-detail">
    <span id="det-kategori" class="category-tag">Memuat...</span>
    <h1 id="det-nama" class="product-name">---</h1>
    <div id="det-harga" class="product-price">Rp 0</div>

    <span class="section-title">Deskripsi Produk</span>
    <div id="det-deskripsi" class="product-description">---</div>
    
    <span class="section-title">Informasi Penjual</span>
    <div style="display: flex; align-items: center; gap: 12px; margin-top: 10px;">
        <div style="width: 40px; height: 40px; background: #e2e8f0; border-radius: 50%; display: flex; align-items: center; justify-content: center;">
            <i class="fa-solid fa-store" style="font-size: 0.9rem; color: #64748b;"></i>
        </div>
        <div>
            <span id="det-owner" style="font-size: 0.85rem; font-weight: 700; display: block;">---</span>
            <span style="font-size: 0.65rem; color: #94a3b8; font-weight: 600;">Terverifikasi</span>
        </div>
    </div>
</div>

<div class="footer-action">
    <button class="btn-cart" onclick="addToCart()">Keranjang</button>
    <button class="btn-buy" onclick="buyNow()">Beli Sekarang</button>
</div>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyDGRsCcT-7Bv_nOAybjXyuIT6Ca0IT4YTg",
        databaseURL: "https://market-d978f-default-rtdb.asia-southeast1.firebasedatabase.app",
        projectId: "market-d978f",
    };
    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    const urlParams = new URLSearchParams(window.location.search);
    const productId = urlParams.get('id');

    async function loadProductDetail() {
        if (!productId) {
            alert("Produk tidak ditemukan.");
            location.href = 'dashboard.html';
            return;
        }

        db.ref('products').orderByChild('productId').equalTo(productId).on('value', (snap) => {
            document.getElementById('loading-overlay').style.display = 'none';
            
            if (snap.exists()) {
                snap.forEach(child => {
                    const data = child.val();
                    document.getElementById('det-foto').src = data.foto;
                    document.getElementById('det-nama').innerText = data.nama;
                    document.getElementById('det-kategori').innerText = data.kategori || "Umum";
                    document.getElementById('det-harga').innerText = "Rp " + data.harga.toLocaleString('id-ID');
                    document.getElementById('det-deskripsi').innerText = data.deskripsi || "Tidak ada deskripsi.";
                    document.getElementById('det-owner').innerText = data.uploadBy || "Admin";
                    
                    document.title = data.nama;
                });
            } else {
                alert("Data produk tidak tersedia.");
                location.href = 'dashboard.html';
            }
        });
    }

    function addToCart() {
        alert("Produk dimasukkan ke keranjang.");
    }

    function buyNow() {
        alert("Melanjutkan ke proses pembayaran.");
    }

    window.onload = loadProductDetail;
</script>
</body>
</html>
