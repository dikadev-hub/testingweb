<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Deposit Otomatis - SAT STORE</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        body { 
            background: #f0f4f8; font-family: 'Inter', sans-serif; margin: 0; text-transform: lowercase;
            display: flex; justify-content: center; align-items: center; min-height: 100vh;
        }
        .depo-card {
            background: white; padding: 30px; border-radius: 25px; box-shadow: 0 15px 40px rgba(0,0,0,0.1);
            width: 90%; max-width: 400px; text-align: center; border: 1px solid #fff;
        }
        .qris-img { width: 100%; border-radius: 20px; margin-bottom: 20px; border: 1px solid #e2e880; }
        .upload-area {
            border: 2px dashed #cbd5e1; padding: 25px; border-radius: 20px; cursor: pointer;
            background: #f8fafc; transition: 0.3s; position: relative;
        }
        .upload-area:hover { background: #f1f5f9; border-color: #007bff; }
        #preview-img { width: 100%; border-radius: 15px; display: none; margin-top: 10px; }
        .btn-confirm {
            width: 100%; padding: 15px; border-radius: 15px; border: none; background: #1a1a1a;
            color: white; font-weight: 800; cursor: pointer; margin-top: 20px; transition: 0.3s;
        }
        .btn-confirm:active { transform: scale(0.98); }
        .btn-confirm:disabled { background: #94a3b8; cursor: not-allowed; }
        .loading-status { display: none; margin-top: 15px; font-size: 0.75rem; color: #64748b; font-weight: 700; }
    </style>
</head>
<body>

    <div class="depo-card">
        <h2 style="font-weight: 900; letter-spacing: -1px; margin-bottom: 5px;">top up saldo</h2>
        <p style="font-size: 0.7rem; color: #94a3b8; font-weight: 800; text-transform: uppercase; margin-bottom: 20px;">otomatis by llama vision</p>
        
        <img src="https://i.ibb.co.com/0Rnz0P74/IMG-20260505-WA0059.jpg" class="qris-img" alt="QRIS Merchant">

        <div class="upload-area" onclick="document.getElementById('file-input').click()">
            <div id="upload-placeholder">
                <i class="fa-solid fa-camera" style="font-size: 1.5rem; color: #007bff; margin-bottom: 10px;"></i>
                <p style="font-size: 0.8rem; font-weight: 700;">pilih foto bukti transfer</p>
            </div>
            <img id="preview-img">
            <input type="file" id="file-input" hidden accept="image/*" onchange="previewFile()">
        </div>

        <button id="btn-submit" class="btn-confirm" onclick="prosesDeposit()">konfirmasi deposit</button>
        
        <div id="status-box" class="loading-status">
            <i class="fa-solid fa-circle-notch fa-spin"></i> <span id="status-text">sedang diproses...</span>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>

    <script>
        // Konfigurasi Firebase
        const firebaseConfig = {
            apiKey: "AIzaSyDGRsCcT-7Bv_nOAybjXyuIT6Ca0IT4YTg",
            databaseURL: "https://market-d978f-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "market-d978f"
        };
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        const IMGBB_API_KEY = "50145b1eaa1385c3d9549ebe496eb5b5";
        
        // API Keys Groq (Gunakan sistem rotasi jika limit)
        const p1 = "gsk_ji3IChgCS"; const p1_ = "R3yH0CyXI78WGdyb3FYezpxD9G0zgzLnEpbzVQoFltl";
        const p2 = "gsk_B71OpeIS"; const p2_ = "m5H9HSI9x3uAWGdyb3FY5nAJNqaSeusVnPHZbjK3NyXK";
        const p3 = "gsk_i6V2S8Fc"; const p3_ = "qiR5hz0PdPggWGdyb3FYYm1bDPNxOOyqWtAiSZnekbOw";
        const p4 = "gsk_PCvVdMUt"; const p4_ = "hQbvwutBhR9BWGdyb3FYGbLtlNEIVXoXd76RSV7YzHa3";

        const groqKeys = [p1+p1_, p2+p2_, p3+p3_, p4+p4_];

        function previewFile() {
            const file = document.getElementById('file-input').files[0];
            const preview = document.getElementById('preview-img');
            const placeholder = document.getElementById('upload-placeholder');
            if (file) {
                const reader = new FileReader();
                reader.onload = (e) => {
                    preview.src = e.target.result;
                    preview.style.display = 'block';
                    placeholder.style.display = 'none';
                }
                reader.readAsDataURL(file);
            }
        }

        async function callGroqAI(imageUrl) {
            const promptAI = `ANALISIS STRUK TRANSFER QRIS. 1. Apakah ini struk asli? Jika bukan, {"valid": false}. 2. Harus ada kata "BERHASIL" atau "SUCCESS". 3. Merchant HARUS "SAT STORE OK2097556". 4. NMID HARUS "ID2025368915901". Hasil wajib JSON: {"nominal": angka, "ref": "ID_REF", "valid": true}. HANYA OUTPUT JSON TANPA TEKS LAIN.`;

            for (let key of groqKeys) {
                try {
                    const response = await fetch("https://api.groq.com/openai/v1/chat/completions", {
                        method: "POST",
                        headers: { 
                            "Authorization": `Bearer ${key}`, 
                            "Content-Type": "application/json" 
                        },
                        body: JSON.stringify({
                            model: "llama-3.2-11b-vision-preview",
                            messages: [{
                                role: "user",
                                content: [
                                    { type: "text", text: promptAI },
                                    { type: "image_url", image_url: { url: imageUrl } }
                                ]
                            }],
                            response_format: { type: "json_object" },
                            temperature: 0
                        })
                    });

                    const data = await response.json();
                    
                    // PERBAIKAN: Validasi keberadaan data.choices sebelum akses [0]
                    if (data && data.choices && data.choices.length > 0) {
                        const content = data.choices[0].message.content;
                        return JSON.parse(content);
                    } else {
                        console.warn("Key Limit/Error, mencoba key lain...", data);
                        continue; 
                    }
                } catch (e) {
                    console.error("Kesalahan pada key ini:", e);
                    continue;
                }
            }
            throw new Error("semua server AI sedang sibuk/limit. coba lagi dalam 1 menit.");
        }

        async function prosesDeposit() {
            const fileInput = document.getElementById('file-input');
            const btn = document.getElementById('btn-submit');
            const statusBox = document.getElementById('status-box');
            const statusText = document.getElementById('status-text');
            const token = localStorage.getItem('sessionToken');

            if (!fileInput.files[0]) return alert("pilih foto dulu!");
            if (!token) return alert("silakan login ulang.");

            btn.disabled = true;
            statusBox.style.display = 'block';

            try {
                // Step 1: Upload ke ImgBB
                statusText.innerText = "mengunggah bukti...";
                const formData = new FormData();
                formData.append("image", fileInput.files[0]);
                const uploadRes = await fetch(`https://api.imgbb.com/1/upload?key=${IMGBB_API_KEY}`, { method: "POST", body: formData });
                const uploadData = await uploadRes.json();
                
                if(!uploadData.success) throw new Error("gagal upload gambar ke server.");
                const imageUrl = uploadData.data.url;

                // Step 2: Verifikasi AI
                statusText.innerText = "ai memverifikasi...";
                const resAI = await callGroqAI(imageUrl);

                // Step 3: Validasi Hasil AI & Update DB
                if (resAI && resAI.valid === true && resAI.nominal > 0 && resAI.ref) {
                    statusText.innerText = "memperbarui saldo...";
                    await updateSaldoDatabase(token, resAI.nominal, resAI.ref, imageUrl);
                } else {
                    alert("STRUK DITOLAK! Pastikan struk asli, status BERHASIL, dan Merchant SAT STORE.");
                }
            } catch (err) {
                alert("Error: " + err.message);
            } finally {
                btn.disabled = false;
                statusBox.style.display = 'none';
            }
        }

        async function updateSaldoDatabase(token, nominal, ref, imageUrl) {
            const amount = parseInt(nominal);
            const cleanRef = ref.toString().replace(/[^a-zA-Z0-9]/g, "");

            // Cek Double Claim
            const refSnap = await db.ref('used_receipts/' + cleanRef).once('value');
            if (refSnap.exists()) {
                throw new Error("struk ini sudah pernah diklaim sebelumnya!");
            }

            const userRef = db.ref('users/' + token);
            const userSnap = await userRef.once('value');
            
            if (!userSnap.exists()) {
                throw new Error("data pengguna tidak ditemukan.");
            }

            const currentBalance = parseInt(userSnap.val().balance || 0);

            // Update Atomic
            const updates = {};
            updates['deposit_history/' + Date.now()] = { 
                userToken: token, 
                amount, 
                ref: cleanRef, 
                time: Date.now(), 
                image: imageUrl 
            };
            updates['used_receipts/' + cleanRef] = { usedBy: token, time: Date.now() };
            updates['users/' + token + '/balance'] = currentBalance + amount;

            await db.ref().update(updates);
            alert(`✅ Berhasil! Saldo Rp ${amount.toLocaleString()} ditambahkan.`);
            location.reload(); // Atau ke dashboard.html
        }
    </script>
</body>
</html>
