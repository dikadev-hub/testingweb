<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>deposit - sat store</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        body { background: #f0f4f8; font-family: 'inter', sans-serif; margin: 0; text-transform: lowercase; padding: 20px; }
        .depo-card { background: white; padding: 25px; border-radius: 25px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); max-width: 400px; margin: auto; text-align: center; }
        input { width: 100%; padding: 15px; border-radius: 15px; border: 1.5px solid #e2e8f0; margin-bottom: 15px; text-align: center; font-weight: 800; font-family: 'inter'; }
        .qris-box { display: none; margin-top: 10px; }
        .qris-img { width: 100%; border-radius: 20px; border: 1px solid #ddd; margin-bottom: 10px; }
        .upload-area { border: 2px dashed #cbd5e1; padding: 20px; border-radius: 20px; cursor: pointer; background: #f8fafc; margin-top: 15px; position: relative; }
        #preview-img { width: 100%; border-radius: 15px; display: none; margin-top: 10px; }
        .btn { width: 100%; padding: 15px; border-radius: 15px; border: none; background: #1a1a1a; color: white; font-weight: 800; cursor: pointer; margin-top: 15px; font-size: 1rem; }
        .btn:disabled { background: #94a3b8; }
        .btn-wa { background: #25d366; display: none; text-decoration: none; align-items: center; justify-content: center; gap: 10px; box-sizing: border-box; }
        label { display: block; text-align: left; font-size: 0.75rem; font-weight: 800; color: #64748b; margin-bottom: 5px; }
    </style>
</head>
<body>

<div class="depo-card">
    <h3 style="font-weight: 900; margin-bottom: 20px;">top up saldo</h3>
    
    <div id="step-1">
        <label>masukkan nominal deposit</label>
        <input type="number" id="nominal" placeholder="min. 10.000">
        <button class="btn" onclick="showQRIS()">lanjut pembayaran</button>
    </div>

    <div id="step-2" class="qris-box">
        <img src="https://i.ibb.co.com/0Rnz0P74/IMG-20260505-WA0059.jpg" class="qris-img">
        <p style="font-size: 0.7rem; color: #ef4444; font-weight: 800; margin-bottom: 15px;">*silahkan transfer sesuai nominal</p>
        
        <label>upload bukti transfer</label>
        <div class="upload-area" onclick="document.getElementById('file-input').click()">
            <i class="fa-solid fa-camera" id="icon-camera"></i>
            <p id="upload-text" style="font-size: 0.8rem; font-weight: 700; margin: 5px 0;">klik untuk pilih foto</p>
            <img id="preview-img">
            <input type="file" id="file-input" hidden accept="image/*" onchange="previewFile()">
        </div>

        <button id="btn-submit" class="btn" onclick="kirimKonfirmasi()">kirim bukti ke admin</button>
        
        <a id="btn-wa" class="btn btn-wa" target="_blank">
            <i class="fa-brands fa-whatsapp"></i> chat admin (konfirmasi)
        </a>
    </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>

<script>
    // 1. Inisialisasi Variabel Global
    let db;
    const firebaseConfig = {
        apiKey: "AIzaSyDGRsCcT-7Bv_nOAybjXyuIT6Ca0IT4YTg",
        databaseURL: "https://market-d978f-default-rtdb.asia-southeast1.firebasedatabase.app",
        projectId: "market-d978f"
    };

    // 2. Fungsi Inisialisasi Firebase (Mencegah error 'db' before initialization)
    function initFirebase() {
        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        db = firebase.database();
    }

    // Jalankan inisialisasi segera
    initFirebase();

    function showQRIS() {
        const nom = document.getElementById('nominal').value;
        if (!nom || nom < 10000) return alert("minimal deposit 10.000");
        document.getElementById('step-1').style.display = 'none';
        document.getElementById('step-2').style.display = 'block';
    }

    function previewFile() {
        const file = document.getElementById('file-input').files[0];
        const preview = document.getElementById('preview-img');
        const icon = document.getElementById('icon-camera');
        const text = document.getElementById('upload-text');
        
        if (file) {
            const reader = new FileReader();
            reader.onload = (e) => {
                preview.src = e.target.result;
                preview.style.display = 'block';
                icon.style.display = 'none';
                text.style.display = 'none';
            }
            reader.readAsDataURL(file);
        }
    }

    async function kirimKonfirmasi() {
        const token = localStorage.getItem('sessionToken');
        const nominal = document.getElementById('nominal').value;
        const file = document.getElementById('file-input').files[0];
        const btn = document.getElementById('btn-submit');
        
        if (!token) return alert("sesi habis, silahkan login kembali");
        if (!file) return alert("mohon upload bukti transfer!");
        
        btn.disabled = true;
        btn.innerText = "sedang mengirim...";

        try {
            // Upload ke ImgBB
            const formData = new FormData();
            formData.append("image", file);
            
            const res = await fetch("https://api.imgbb.com/1/upload?key=50145b1eaa1385c3d9549ebe496eb5b5", { 
                method: "POST", 
                body: formData 
            });
            
            const dataImg = await res.json();
            if (!dataImg.success) throw new Error("gagal upload gambar");
            
            const imageUrl = dataImg.data.url;
            const depoId = "depo-" + Date.now();

            // Pastikan 'db' sudah ada sebelum dipakai
            if (!db) initFirebase();

            await db.ref('pending_deposit/' + depoId).set({
                depoId: depoId,
                token: token,
                nominal: parseInt(nominal),
                imageUrl: imageUrl,
                status: "pending",
                time: new Date().toLocaleString()
            });

            alert("bukti terkirim! saldo akan masuk setelah dicek admin.");
            
            // Tampilkan tombol WA
            const pesan = `hallo admin, saya sudah deposit:\nid: ${depoId}\nnominal: rp ${nominal}\nbukti: ${imageUrl}`;
            const btnWa = document.getElementById('btn-wa');
            btnWa.href = `https://wa.me/628123456789?text=${encodeURIComponent(pesan)}`; // GANTI NOMOR WA DISINI
            btnWa.style.display = 'flex';
            btn.style.display = 'none';

        } catch (e) { 
            alert("gagal mengirim: " + e.message); 
            btn.disabled = false;
            btn.innerText = "kirim bukti ke admin";
        }
    }
</script>
</body>
</html>
