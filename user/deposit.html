<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>deposit otomatis - sat store</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        body { 
            background: #f0f4f8; font-family: 'inter', sans-serif; margin: 0; text-transform: lowercase;
            display: flex; justify-content: center; align-items: center; min-height: 100vh;
        }
        .depo-card {
            background: white; padding: 30px; border-radius: 25px; box-shadow: 0 15px 40px rgba(0,0,0,0.1);
            width: 90%; max-width: 400px; text-align: center; border: 1px solid #fff;
        }
        .qris-img { width: 100%; border-radius: 20px; margin-bottom: 20px; border: 1px solid #e2e8f0; }
        .upload-area {
            border: 2px dashed #cbd5e1; padding: 25px; border-radius: 20px; cursor: pointer;
            background: #f8fafc;
        }
        #preview-img { width: 100%; border-radius: 15px; display: none; margin-top: 10px; }
        .btn-confirm {
            width: 100%; padding: 15px; border-radius: 15px; border: none; background: #1a1a1a;
            color: white; font-weight: 800; cursor: pointer; margin-top: 20px;
        }
        .btn-confirm:disabled { background: #94a3b8; }
        .loading-status { display: none; margin-top: 15px; font-size: 0.75rem; color: #64748b; font-weight: 700; }
    </style>
</head>
<body>

    <div class="depo-card">
        <h2 style="font-weight: 900; letter-spacing: -1px; margin-bottom: 5px;">top up saldo</h2>
        <p style="font-size: 0.7rem; color: #94a3b8; font-weight: 800; text-transform: uppercase; margin-bottom: 20px;">otomatis by llama 4 vision</p>
        
        <img src="https://i.ibb.co.com/0Rnz0P74/IMG-20260505-WA0059.jpg" class="qris-img">

        <div class="upload-area" onclick="document.getElementById('file-input').click()">
            <div id="upload-placeholder">
                <i class="fa-solid fa-camera" style="font-size: 1.5rem; color: #007bff; margin-bottom: 10px;"></i>
                <p style="font-size: 0.8rem; font-weight: 700;">pilih foto bukti transfer</p>
            </div>
            <img id="preview-img">
            <input type="file" id="file-input" hidden accept="image/*" onchange="previewFile()">
        </div>

        <button id="btn-submit" class="btn-confirm" onclick="prosesDeposit()">konfirmasi deposit</button>
        
        <div id="status-box" class="loading-status">
            <i class="fa-solid fa-circle-notch fa-spin"></i> <span id="status-text">sedang diproses...</span>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDGRsCcT-7Bv_nOAybjXyuIT6Ca0IT4YTg",
            databaseURL: "https://market-d978f-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "market-d978f"
        };
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        const IMGBB_API_KEY = "50145b1eaa1385c3d9549ebe496eb5b5";
        const s1 = "gsk_ji3IChgCS";
        const s2 = "R3yH0CyXI78WGdyb3FYezpxD9G0zgzLnEpbzVQoFltl";
        const groqKeys = [s1 + s2];

        function previewFile() {
            const file = document.getElementById('file-input').files[0];
            const preview = document.getElementById('preview-img');
            const placeholder = document.getElementById('upload-placeholder');
            if (file) {
                const reader = new FileReader();
                reader.onload = (e) => {
                    preview.src = e.target.result;
                    preview.style.display = 'block';
                    placeholder.style.display = 'none';
                }
                reader.readAsDataURL(file);
            }
        }

        async function prosesDeposit() {
            const fileInput = document.getElementById('file-input');
            const btn = document.getElementById('btn-submit');
            const statusBox = document.getElementById('status-box');
            const statusText = document.getElementById('status-text');
            const token = localStorage.getItem('sessionToken');

            if (!fileInput.files[0]) return alert("pilih foto dulu!");
            if (!token) return alert("silakan login ulang.");

            btn.disabled = true;
            statusBox.style.display = 'block';

            try {
                statusText.innerText = "mengunggah...";
                const formData = new FormData();
                formData.append("image", fileInput.files[0]);
                const uploadRes = await fetch(`https://api.imgbb.com/1/upload?key=${IMGBB_API_KEY}`, { method: "POST", body: formData });
                const uploadData = await uploadRes.json();
                const imageUrl = uploadData.data.url;

                statusText.innerText = "ai memverifikasi...";
                
                // PROMPT SUPER KETAT: Menghindari manipulasi foto apapun
                const promptAI = `ANALISIS STRUK TRANSFER QRIS. 
                1. Apakah ini struk transfer asli? Jika bukan (misal foto orang, benda, atau screenshoot selain struk), wajib jawab {"valid": false}.
                2. Wajib ada kata "BERHASIL" atau "SUCCESS".
                3. Merchant HARUS "SAT STORE OK2097556".
                4. NMID HARUS "ID2025368915901".
                Jika semua syarat terpenuhi, ekstrak data: {"nominal": angka_saja, "ref": "ID_REF", "valid": true}.
                Jika salah satu gagal, jawab: {"valid": false}.
                HANYA OUTPUT JSON.`;

                const groqRes = await fetch("https://api.groq.com/openai/v1/chat/completions", {
                    method: "POST",
                    headers: { "Authorization": `Bearer ${groqKeys[0]}`, "Content-Type": "application/json" },
                    body: JSON.stringify({
                        model: "meta-llama/llama-4-scout-17b-16e-instruct",
                        messages: [{
                            role: "user",
                            content: [
                                { type: "text", text: promptAI },
                                { type: "image_url", image_url: { url: imageUrl } }
                            ]
                        }],
                        response_format: { type: "json_object" }
                    })
                });

                const data = await groqRes.json();
                const res = JSON.parse(data.choices[0].message.content);

                // CEK APAKAH AI MENYATAKAN VALID
                if (res.valid === true && res.nominal > 0 && res.ref) {
                    await updateSaldoDatabase(token, res.nominal, res.ref, imageUrl);
                } else {
                    alert("STRUK DITOLAK! Pastikan foto adalah struk asli ke SAT STORE.");
                }

            } catch (err) {
                alert("error: " + err.message);
            } finally {
                btn.disabled = false;
                statusBox.style.display = 'none';
            }
        }

        async function updateSaldoDatabase(token, nominal, ref, imageUrl) {
            const amount = parseInt(nominal);
            // Cek Double Claim
            const refSnap = await db.ref('used_receipts/' + ref).once('value');
            if (refSnap.exists()) return alert("struk sudah pernah dipakai!");

            const userRef = db.ref('users/' + token);
            const userSnap = await userRef.once('value');
            const currentBalance = userSnap.val().balance || 0;

            await db.ref('deposit_history').push({ userToken: token, amount, ref, time: Date.now(), image: imageUrl });
            await db.ref('used_receipts/' + ref).set(true);
            await userRef.update({ balance: currentBalance + amount });

            alert(`✅ saldo rp ${amount.toLocaleString()} masuk!`);
            location.href = 'dashboard.html';
        }
    </script>
</body>
</html>
