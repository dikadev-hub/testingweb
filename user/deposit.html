<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>deposit - sat store</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        body { background: #f0f4f8; font-family: 'inter', sans-serif; margin: 0; text-transform: lowercase; padding: 20px; }
        .depo-card { background: white; padding: 25px; border-radius: 25px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); max-width: 400px; margin: auto; text-align: center; }
        input { width: 100%; padding: 15px; border-radius: 15px; border: 1.5px solid #e2e8f0; margin-bottom: 15px; text-align: center; font-weight: 800; }
        .qris-box { display: none; margin-top: 10px; }
        .qris-img { width: 100%; border-radius: 20px; border: 1px solid #ddd; }
        .upload-area { border: 2px dashed #cbd5e1; padding: 20px; border-radius: 20px; cursor: pointer; background: #f8fafc; margin-top: 15px; }
        #preview-img { width: 100%; border-radius: 15px; display: none; margin-top: 10px; }
        .btn { width: 100%; padding: 15px; border-radius: 15px; border: none; background: #1a1a1a; color: white; font-weight: 800; cursor: pointer; margin-top: 15px; }
        .btn-wa { background: #25d366; display: none; text-decoration: none; align-items: center; justify-content: center; gap: 10px; }
    </style>
</head>
<body>

<div class="depo-card">
    <h3 style="font-weight: 900;">top up saldo</h3>
    
    <div id="step-1">
        <p style="font-size: 0.75rem; color: #94a3b8;">masukkan nominal deposit</p>
        <input type="number" id="nominal" placeholder="min. 10.000">
        <button class="btn" onclick="showQRIS()">lanjut pembayaran</button>
    </div>

    <div id="step-2" class="qris-box">
        <img src="https://i.ibb.co.com/0Rnz0P74/IMG-20260505-WA0059.jpg" class="qris-img">
        <p style="font-size: 0.7rem; color: #ef4444; font-weight: 800;">*silahkan transfer sesuai nominal</p>
        
        <div class="upload-area" onclick="document.getElementById('file-input').click()">
            <i class="fa-solid fa-camera"></i>
            <p id="upload-text" style="font-size: 0.8rem; font-weight: 700;">upload bukti transfer</p>
            <img id="preview-img">
            <input type="file" id="file-input" hidden accept="image/*" onchange="previewFile()">
        </div>

        <button id="btn-submit" class="btn" onclick="kirimKonfirmasi()">kirim bukti ke admin</button>
        <a id="btn-wa" class="btn btn-wa" target="_blank"><i class="fa-brands fa-whatsapp"></i> chat admin</a>
    </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyDGRsCcT-7Bv_nOAybjXyuIT6Ca0IT4YTg",
        databaseURL: "https://market-d978f-default-rtdb.asia-southeast1.firebasedatabase.app",
        projectId: "market-d978f"
    };
    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    function showQRIS() {
        const nom = document.getElementById('nominal').value;
        if (nom < 10000) return alert("minimal deposit 10.000");
        document.getElementById('step-1').style.display = 'none';
        document.getElementById('step-2').style.display = 'block';
    }

    function previewFile() {
        const file = document.getElementById('file-input').files[0];
        const preview = document.getElementById('preview-img');
        if (file) {
            const reader = new FileReader();
            reader.onload = (e) => {
                preview.src = e.target.result;
                preview.style.display = 'block';
                document.getElementById('upload-text').style.display = 'none';
            }
            reader.readAsDataURL(file);
        }
    }

    async function kirimKonfirmasi() {
        const token = localStorage.getItem('sessionToken');
        const nominal = document.getElementById('nominal').value;
        const file = document.getElementById('file-input').files[0];
        
        if (!file) return alert("upload bukti dulu!");
        
        document.getElementById('btn-submit').disabled = true;
        document.getElementById('btn-submit').innerText = "mengirim...";

        try {
            // Upload ke ImgBB
            const formData = new FormData();
            formData.append("image", file);
            const res = await fetch("https://api.imgbb.com/1/upload?key=50145b1eaa1385c3d9549ebe496eb5b5", { method: "POST", body: formData });
            const data = await res.json();
            const imageUrl = data.data.url;

            const depoId = "depo-" + Date.now();
            await db.ref('pending_deposit/' + depoId).set({
                depoId, token, nominal, imageUrl, status: "pending", time: Date.now()
            });

            alert("bukti terkirim! silahkan chat admin untuk mempercepat konfirmasi.");
            
            const pesan = `ADMIN SAYA BARU SAJA MELAKUKAN DEPOSIT SEBESAR ${nominal} TOLONG KONFIRMASI`;
            document.getElementById('btn-wa').href = `https://wa.me/628123456789?text=${encodeURIComponent(pesan)}`;
            document.getElementById('btn-wa').style.display = 'flex';
            document.getElementById('btn-submit').style.display = 'none';

        } catch (e) { alert("gagal: " + e.message); }
    }
</script>
</body>
</html>
