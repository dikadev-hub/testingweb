<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Kelola Produk - Market</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap');
        
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { 
            background: #f8fafc; color: #1e293b; font-family: 'Plus Jakarta Sans', sans-serif; 
            margin: 0; text-transform: lowercase; padding-bottom: 30px;
        }

        /* Navbar */
        .header {
            background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(15px);
            padding: 15px 20px; display: flex; align-items: center; gap: 15px;
            position: sticky; top: 0; z-index: 100; border-bottom: 1px solid #f1f5f9;
        }
        .btn-back {
            width: 40px; height: 40px; background: white; border: 1.5px solid #e2e8f0;
            border-radius: 12px; display: flex; align-items: center; justify-content: center;
            color: #1e293b; text-decoration: none;
        }

        /* Category Filter */
        .kat-nav {
            display: flex; gap: 10px; overflow-x: auto; padding: 15px 20px;
            scrollbar-width: none; background: #f8fafc;
        }
        .kat-nav::-webkit-scrollbar { display: none; }
        .kat-item {
            padding: 8px 16px; background: white; border: 1px solid #e2e8f0;
            border-radius: 12px; font-size: 0.75rem; font-weight: 700; color: #64748b;
            white-space: nowrap; cursor: pointer; transition: 0.3s;
        }
        .kat-item.active { background: #1e293b; color: white; border-color: #1e293b; }

        .container { padding: 0 20px; max-width: 500px; margin: 0 auto; }

        /* Card Design */
        .product-card {
            background: white; border-radius: 22px; padding: 12px; margin-bottom: 12px;
            display: flex; gap: 12px; align-items: center; border: 1px solid #e2e8f0;
            transition: 0.3s; position: relative;
        }
        .img-wrapper {
            width: 75px; height: 75px; border-radius: 16px; overflow: hidden;
            background: #f1f5f9; flex-shrink: 0;
        }
        .img-wrapper img { width: 100%; height: 100%; object-fit: cover; }

        .info { flex: 1; min-width: 0; }
        .info .p-name { font-size: 0.85rem; font-weight: 800; color: #0f172a; display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .info .p-cat { font-size: 0.6rem; font-weight: 900; color: #6366f1; text-transform: uppercase; margin-bottom: 2px; display: block; }
        .info .p-price { font-size: 0.85rem; font-weight: 800; color: #1e293b; margin-top: 4px; display: block; }

        .btn-edit-small {
            background: #f8fafc; border: 1px solid #e2e8f0; padding: 8px 12px;
            border-radius: 10px; font-size: 0.7rem; font-weight: 800; color: #1e293b;
            cursor: pointer; display: flex; align-items: center; gap: 5px;
        }

        /* Modal Design */
        #edit-modal {
            position: fixed; inset: 0; background: rgba(0,0,0,0.6); backdrop-filter: blur(5px);
            display: none; align-items: flex-end; z-index: 1000;
        }
        .modal-body {
            background: white; width: 100%; padding: 25px; border-radius: 25px 25px 0 0;
            animation: slideUp 0.3s ease-out;
        }
        @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }

        .modal-body input {
            width: 100%; padding: 15px; margin: 10px 0; border-radius: 14px;
            border: 1.5px solid #e2e8f0; background: #f8fafc; font-family: inherit; font-weight: 700;
        }
        .btn-confirm { width: 100%; padding: 16px; background: #1a1a1a; color: white; border: none; border-radius: 14px; font-weight: 800; margin-top: 15px; }
        
        .empty { text-align: center; margin-top: 50px; color: #94a3b8; font-weight: 700; }
    </style>
</head>
<body>

<div class="header">
    <a href="dashboard.html" class="btn-back"><i class="fa-solid fa-chevron-left"></i></a>
    <h2 style="font-size: 0.95rem; margin: 0; font-weight: 900;">manajemen produk</h2>
</div>

<div class="kat-nav" id="kat-filter">
    <div class="kat-item active" onclick="filterKat('semua', this)">semua</div>
    <div class="kat-item" onclick="filterKat('akun', this)">akun</div>
    <div class="kat-item" onclick="filterKat('app prem', this)">app prem</div>
    <div class="kat-item" onclick="filterKat('jasa', this)">jasa</div>
    <div class="kat-item" onclick="filterKat('lain nya', this)">lainnya</div>
</div>

<div class="container" id="list-container">
    <div class="empty">memuat data...</div>
</div>

<div id="edit-modal">
    <div class="modal-body">
        <span style="font-weight: 900; font-size: 1rem; display: block; margin-bottom: 15px;">ubah data produk</span>
        <input type="hidden" id="key-edit">
        <label style="font-size: 0.65rem; font-weight: 800; color: #94a3b8;">harga baru (rp)</label>
        <input type="number" id="harga-edit">
        <label style="font-size: 0.65rem; font-weight: 800; color: #94a3b8;">stok</label>
        <input type="number" id="stok-edit">
        <button class="btn-confirm" onclick="simpanEdit()">simpan perubahan</button>
        <button onclick="closeModal()" style="width:100%; background:none; border:none; margin-top:15px; color:#ef4444; font-weight:700;">batal</button>
    </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>

<script>
    const firebaseconfig = {
        apiKey: "AIzaSyDGRsCcT-7Bv_nOAybjXyuIT6Ca0IT4YTg",
        databaseURL: "https://market-d978f-default-rtdb.asia-southeast1.firebasedatabase.app",
        projectId: "market-d978f",
    };
    if (!firebase.apps.length) firebase.initializeApp(firebaseconfig);
    const db = firebase.database();
    const token = localStorage.getItem('sessionToken');

    let allProducts = [];
    let currentCategory = 'semua';

    function loadData() {
        if(!token) return location.href='login.html';

        // Ambil data dari pending_products (sesuaikan jika ada tabel lain)
        db.ref('pending_products').orderByChild('ownerToken').equalTo(token).on('value', (snap) => {
            allProducts = [];
            if(snap.exists()){
                snap.forEach(c => {
                    allProducts.push({ key: c.key, ...c.val() });
                });
                renderProducts();
            } else {
                document.getElementById('list-container').innerHTML = '<div class="empty">kamu belum punya produk.</div>';
            }
        });
    }

    function renderProducts() {
        const container = document.getElementById('list-container');
        container.innerHTML = "";

        const filtered = allProducts.filter(p => {
            if(currentCategory === 'semua') return true;
            // Cek jika kategori produk mengandung kata kunci filter (misal: 'jasa push' mengandung 'jasa')
            return p.kategori.toLowerCase().includes(currentCategory);
        });

        if(filtered.length === 0) {
            container.innerHTML = '<div class="empty">tidak ada produk di kategori ini.</div>';
            return;
        }

        filtered.forEach(p => {
            container.innerHTML += `
                <div class="product-card">
                    <div class="img-wrapper"><img src="${p.foto}"></div>
                    <div class="info">
                        <span class="p-cat">${p.kategori}</span>
                        <span class="p-name">${p.nama}</span>
                        <span class="p-price">rp ${p.harga.toLocaleString('id-ID')}</span>
                    </div>
                    <div style="display:flex; flex-direction:column; gap:8px;">
                        <button class="btn-edit-small" onclick="openEdit('${p.key}', ${p.harga}, ${p.stok})"><i class="fa-solid fa-pen"></i></button>
                        <button class="btn-edit-small" style="color:#ef4444;" onclick="hapus('${p.key}')"><i class="fa-solid fa-trash"></i></button>
                    </div>
                </div>
            `;
        });
    }

    function filterKat(kat, el) {
        currentCategory = kat;
        document.querySelectorAll('.kat-item').forEach(i => i.classList.remove('active'));
        el.classList.add('active');
        renderProducts();
    }

    function openEdit(key, harga, stok) {
        document.getElementById('key-edit').value = key;
        document.getElementById('harga-edit').value = harga;
        document.getElementById('stok-edit').value = stok;
        document.getElementById('edit-modal').style.display = 'flex';
    }

    function closeModal() { document.getElementById('edit-modal').style.display = 'none'; }

    function simpanEdit() {
        const key = document.getElementById('key-edit').value;
        const h = parseInt(document.getElementById('harga-edit').value);
        const s = parseInt(document.getElementById('stok-edit').value);
        
        db.ref('pending_products/' + key).update({ harga: h, stok: s })
        .then(() => {
            alert("data diperbarui!");
            closeModal();
        });
    }

    function hapus(key) {
        if(confirm('hapus produk ini secara permanen?')) {
            db.ref('pending_products/' + key).remove();
        }
    }

    window.onload = loadData;
</script>
</body>
</html>
