<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Assistant - SAT STORE</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <script src="../setting.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap');

        body {
            background: #0f172a;
            font-family: 'Plus Jakarta Sans', sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
            color: white;
            text-transform: lowercase;
        }

        .chat-header {
            padding: 20px;
            background: #1e293b;
            display: flex;
            align-items: center;
            gap: 15px;
            border-bottom: 1px solid #334155;
        }

        .chat-header h3 { margin: 0; font-size: 1.1rem; font-weight: 800; }
        .status-dot { width: 10px; height: 10px; background: #22c55e; border-radius: 50%; }

        #chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .msg { max-width: 80%; padding: 12px 16px; border-radius: 18px; font-size: 0.9rem; line-height: 1.5; }
        .user-msg {
            align-self: flex-end;
            background: #3b82f6;
            color: white;
            border-bottom-right-radius: 4px;
        }
        .ai-msg {
            align-self: flex-start;
            background: #1e293b;
            color: #e2e8f0;
            border-bottom-left-radius: 4px;
            border: 1px solid #334155;
        }

        .input-area {
            padding: 20px;
            background: #1e293b;
            display: flex;
            gap: 10px;
            align-items: center;
        }

        input {
            flex: 1;
            background: #0f172a;
            border: 1px solid #334155;
            padding: 14px;
            border-radius: 12px;
            color: white;
            outline: none;
        }

        button {
            background: #3b82f6;
            color: white;
            border: none;
            width: 50px;
            height: 50px;
            border-radius: 12px;
            cursor: pointer;
            transition: 0.3s;
        }

        button:disabled { background: #475569; }

        .loading-chat { font-style: italic; font-size: 0.7rem; color: #94a3b8; }
    </style>
</head>
<body>

<div class="chat-header">
    <a href="dashboard.html" style="color: white;"><i class="fa-solid fa-arrow-left"></i></a>
    <div class="status-dot"></div>
    <h3>sat store - ai assistant</h3>
</div>

<div id="chat-container">
    <div class="msg ai-msg">hallo! saya asisten ai sat store. ada yang bisa saya bantu mengenai produk kami?</div>
</div>

<div class="input-area">
    <input type="text" id="user-input" placeholder="tanya stok atau harga produk..." onkeypress="if(event.key === 'Enter') sendMessage()">
    <button id="send-btn" onclick="sendMessage()"><i class="fa-solid fa-paper-plane"></i></button>
</div>

<script>
    // Inisialisasi Firebase
    if (!firebase.apps.length) { firebase.initializeApp(firebaseConfig); }
    const db = firebase.database();

    // Penyusunan API Key Groq (Part System)
    const p1 = "gsk_";
    const keys = [
        p1 + "B71OpeISm5H9HSI9x3uAWGdyb3FY5nAJNqaSeusVnPHZbjK3NyXK",
        p1 + "i6V2S8FcqiR5hz0PdPggWGdyb3FYYm1bDPNxOOyqWtAiSZnekbOw",
        p1 + "PCvVdMUthQbvwutBhR9BWGdyb3FYGbLtlNEIVXoXd76RSV7YzHa3"
    ];
    
    let currentKeyIndex = 0;

    async function getProductData() {
        const snapshot = await db.ref('products').once('value');
        if (!snapshot.exists()) return "saat ini tidak ada produk tersedia.";
        
        let list = "berikut produk yang tersedia di sat store:\n";
        const allData = snapshot.val();
        
        for (let owner in allData) {
            for (let id in allData[owner]) {
                const p = allData[owner][id];
                list += `- ${p.nama} | kategori: ${p.kategori} | harga: rp ${p.harga} | stok: ${p.stok}\n`;
            }
        }
        return list;
    }

    async function sendMessage() {
        const inputEl = document.getElementById('user-input');
        const container = document.getElementById('chat-container');
        const btn = document.getElementById('send-btn');
        const query = inputEl.value.trim();

        if (!query) return;

        // Tampilkan pesan user
        container.innerHTML += `<div class="msg user-msg">${query}</div>`;
        inputEl.value = "";
        container.scrollTop = container.scrollHeight;

        btn.disabled = true;
        const loadingMsg = document.createElement('div');
        loadingMsg.className = "loading-chat";
        loadingMsg.innerText = "ai sedang berpikir...";
        container.appendChild(loadingMsg);

        try {
            const contextData = await getProductData();
            
            const response = await fetch("https://api.groq.com/openai/v1/chat/completions", {
                method: "POST",
                headers: {
                    "Authorization": `Bearer ${keys[currentKeyIndex]}`,
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    model: "llama3-8b-8192",
                    messages: [
                        { role: "system", content: "kamu adalah asisten toko digital bernama SAT STORE. gunakan bahasa gaul, ramah, dan santai. informasi produk: " + contextData },
                        { role: "user", content: query }
                    ]
                })
            });

            const result = await response.json();
            
            // Jika limit atau error, ganti key otomatis
            if (result.error) {
                currentKeyIndex = (currentKeyIndex + 1) % keys.length;
                throw new Error("mencoba menghubungkan ulang...");
            }

            const aiReply = result.choices[0].message.content;
            loadingMsg.remove();
            container.innerHTML += `<div class="msg ai-msg">${aiReply}</div>`;
            
        } catch (err) {
            loadingMsg.innerText = "error: " + err.message + ". coba kirim lagi.";
            btn.disabled = false;
        }

        btn.disabled = false;
        container.scrollTop = container.scrollHeight;
    }
</script>

</body>
</html>
