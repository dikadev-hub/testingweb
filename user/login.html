<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>login akun</title>
    <style>
        body { background: #f8fafc; font-family: sans-serif; margin: 0; display: flex; align-items: center; justify-content: center; height: 100vh; text-transform: lowercase; }
        .box { background: white; padding: 30px; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); width: 90%; max-width: 350px; border: 1px solid #e2e8f0; }
        h2 { text-align: center; color: #2563eb; margin-bottom: 20px; }
        .input-group { margin-bottom: 15px; }
        label { display: block; font-size: 12px; color: #64748b; margin-bottom: 5px; font-weight: bold; }
        input { width: 100%; padding: 12px; border-radius: 10px; border: 1px solid #e2e8f0; box-sizing: border-box; background: #f1f5f9; }
        button { width: 100%; padding: 12px; border: none; border-radius: 10px; background: #2563eb; color: white; font-weight: bold; cursor: pointer; margin-top: 10px; }
        .link { text-align: center; margin-top: 15px; font-size: 13px; color: #64748b; }
        a { color: #2563eb; text-decoration: none; font-weight: bold; }
    </style>
</head>
<body>

<div class="box">
    <h2>login</h2>
    <div class="input-group">
        <label>email</label>
        <input type="email" id="login-email" placeholder="email@gmail.com">
    </div>
    <div class="input-group">
        <label>password</label>
        <input type="password" id="login-pass" placeholder="******">
    </div>
    <button id="btn-login" onclick="handleLogin()">masuk</button>
    <div class="link">belum punya akun? <a href="register.html">daftar</a></div>
</div>

<script>
    async function handleLogin() {
        const email = document.getElementById('login-email').value;
        const pass = document.getElementById('login-pass').value;

        if (!email || !pass) return alert("data wajib di isi");

        const btn = document.getElementById('btn-login');
        btn.innerText = "loading...";
        btn.disabled = true;

        try {
            const res = await fetch('/api/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email: email, pass: pass })
            });
            const result = await res.json();
            if (res.ok) {
                localStorage.setItem('sessionToken', result.sessionToken);
                window.location.href = "user/dashboard.html";
            } else {
                alert(result.message);
            }
        } catch (e) {
            alert("error koneksi");
        } finally {
            btn.innerText = "masuk";
            btn.disabled = false;
        }
    }
</script>
</body>
</html>
