<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="page-title">dashboard</title>
    <script src="../setting.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        @keyframes fadein { from { opacity: 0; } to { opacity: 1; } }
        @keyframes slideDown { from { transform: translateY(-10px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        @keyframes loading-bar { 0% { left: -40%; } 100% { left: 100%; } }

        body { 
            background: #f0f4f8; 
            background-image: radial-gradient(#d1d9e6 1px, transparent 1px);
            background-size: 20px 20px;
            color: #1a1a1a; 
            font-family: 'inter', sans-serif; 
            margin: 0; 
            text-transform: lowercase; 
            overflow-x: hidden;
        }

        #loading-line {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 3px;
            background: #e2e8f0;
            z-index: 10000;
            display: none;
        }
        #loading-line::after {
            content: '';
            position: absolute;
            height: 100%; width: 40%;
            background: #007bff;
            animation: loading-bar 1s infinite linear;
        }

        .header {
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(15px);
            height: 75px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            position: sticky;
            top: 0; z-index: 999;
            border-bottom: 1px solid rgba(0,0,0,0.05);
        }

        .btn-action {
            width: 45px; height: 45px;
            background: #fff;
            border: 1px solid #e2e8f0;
            border-radius: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            color: #1e293b;
            transition: 0.3s;
        }

        .sidebar-box {
            position: absolute;
            top: 85px; left: 20px;
            width: 220px;
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.05);
            display: none;
            z-index: 1001;
            animation: slideDown 0.3s ease;
            border: 1px solid rgba(255, 255, 255, 0.5);
            overflow: hidden;
        }

        .sidebar-title {
            padding: 15px 20px;
            font-size: 0.7rem;
            font-weight: 800;
            color: #94a3b8;
            text-transform: uppercase;
            letter-spacing: 1px;
            border-bottom: 1px solid rgba(0,0,0,0.03);
        }

        .profile-box {
            position: absolute;
            top: 85px; right: 20px;
            width: 280px;
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(15px);
            border-radius: 25px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.1);
            display: none;
            padding: 25px;
            z-index: 1001;
            animation: slideDown 0.3s ease;
            border: 1px solid rgba(255, 255, 255, 0.6);
        }

        .menu-item {
            padding: 12px 20px;
            display: flex;
            align-items: center;
            color: #475569;
            cursor: pointer;
            font-weight: 700;
            transition: 0.2s;
        }
        .menu-item:hover { background: rgba(0, 123, 255, 0.05); color: #007bff; }
        .menu-item i { margin-right: 12px; font-size: 0.9rem; }

        .info-label { font-size: 0.65rem; font-weight: 800; color: #64748b; text-transform: uppercase; margin-top: 15px; display: block; }
        .info-value { font-size: 0.85rem; font-weight: 600; color: #1e293b; display: block; margin-top: 2px; }

        .pass-container { display: flex; align-items: center; justify-content: space-between; margin-top: 2px; }
        .pass-value { font-size: 0.85rem; font-weight: 600; color: #1e293b; letter-spacing: 2px; }
        .btn-toggle-pass { background: none; border: none; color: #94a3b8; cursor: pointer; padding: 5px; }

        .btn-docs {
            width: 100%; padding: 12px;
            background: #1a1a1a; color: white;
            border: none; border-radius: 12px;
            font-weight: 800; cursor: pointer;
            margin-top: 20px; font-size: 0.8rem;
        }

        .overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 1000; display: none; }

        .content { padding: 20px; max-width: 600px; margin: 0 auto; }
        .search-wrapper { background: white; padding: 5px; border-radius: 20px; display: none; box-shadow: 0 10px 25px rgba(0,0,0,0.04); border: 1px solid #fff; }
        .search-wrapper input { width: 100%; padding: 15px; border: none; outline: none; background: transparent; font-size: 0.9rem; }
        
        .form-card { background: white; padding: 25px; border-radius: 25px; box-shadow: 0 10px 25px rgba(0,0,0,0.04); border: 1px solid #fff; }
        .input-group textarea { width: 100%; padding: 15px; background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 15px; outline: none; font-family: inherit; box-sizing: border-box; }

        /* DEPO MODAL */
        .depo-modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); backdrop-filter: blur(5px); z-index: 2000; display: none; align-items: center; justify-content: center; }
        .depo-card { background: white; width: 90%; max-width: 380px; padding: 25px; border-radius: 25px; text-align: center; }
    </style>
</head>
<body>

    <div id="loading-line"></div>
    <div id="overlay" class="overlay" onclick="closeAll()"></div>

    <div class="header">
        <div class="btn-action" onclick="toggleSidebar()">
            <i class="fa-solid fa-bars-staggered"></i>
        </div>
        <div class="btn-action" onclick="toggleProfile()">
            <i class="fa-solid fa-user"></i>
        </div>
    </div>

    <div id="sidebar" class="sidebar-box">
        <div class="sidebar-title">menu utama</div>
        <div class="menu-item" onclick="openSearch()">
            <i class="fa-solid fa-magnifying-glass"></i>
            <span>search produk</span>
        </div>
        <div class="menu-item" onclick="openDepo()">
            <i class="fa-solid fa-wallet"></i>
            <span>isi saldo</span>
        </div>
        <div class="menu-item" onclick="logout()">
            <i class="fa-solid fa-right-from-bracket"></i>
            <span>keluar</span>
        </div>
    </div>

    <div id="profile-card" class="profile-box">
        <span class="info-label">username :</span>
        <span id="p-name" class="info-value">memuat...</span>

        <span class="info-label">saldo akun :</span>
        <span class="info-value">rp <span id="user-balance">0</span></span>

        <span class="info-label">role :</span>
        <span id="p-role" class="info-value">user (member)</span>

        <span class="info-label">api key :</span>
        <span id="p-key" class="info-value">memuat...</span>

        <span class="info-label">no hp :</span>
        <span id="p-phone" class="info-value">memuat...</span>

        <span class="info-label">password :</span>
        <div class="pass-container">
            <span id="p-pass" class="pass-value">••••••••</span>
            <button class="btn-toggle-pass" onclick="togglePass()"><i id="pass-icon" class="fa-solid fa-eye-slash"></i></button>
        </div>

        <button class="btn-docs" onclick="window.location.href='docs.html'">docs api</button>
    </div>

    <div id="depo-modal-area" class="depo-modal">
        <div class="depo-card">
            <div id="input-depo-area">
                <h3 style="margin: 0;">deposit saldo</h3>
                <p style="font-size: 0.7rem; color: #64748b; margin-bottom: 20px;">min 2.000 + biaya 300</p>
                <input type="number" id="depo-amount" placeholder="nominal..." style="width: 100%; padding: 15px; border-radius: 12px; border: 1px solid #ddd; margin-bottom: 15px; box-sizing: border-box;">
                <button onclick="prosesDeposit()" id="btn-create-depo" style="width: 100%; padding: 15px; border-radius: 15px; border: none; background: #1a1a1a; color: white; font-weight: 800; cursor: pointer;">buat qris</button>
            </div>
            <div id="qris-display-area" style="display: none;">
                <img id="qris-img" src="" style="width: 100%; border-radius: 12px; border: 1px solid #eee;">
                <p style="color: red; font-size: 0.7rem; font-weight: 800; margin-top: 15px;">silahkan bayar QR di atas!<br>saldo masuk otomatis setelah lunas.</p>
            </div>
            <button onclick="closeDepo()" style="margin-top: 20px; background: none; border: none; color: #94a3b8; cursor: pointer;">tutup</button>
        </div>
    </div>

    <div class="content">
        <div id="search-box" class="search-wrapper">
            <input type="text" id="pencarian" placeholder="cari produk apa kak?">
        </div>

        <div id="main-placeholder" style="text-align: center; margin-top: 50px; opacity: 0.2;">
            <i class="fa-solid fa-layer-group" style="font-size: 3rem;"></i>
            <p style="margin-top: 10px;">silahkan pilih menu</p>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDGRsCcT-7Bv_nOAybjXyuIT6Ca0IT4YTg",
            authDomain: "market-d978f.firebaseapp.com",
            databaseURL: "https://market-d978f-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "market-d978f",
            storageBucket: "market-d978f.firebasestorage.app",
            messagingSenderId: "291695486607",
            appId: "1:291695486607:web:dd860d16639b47c163f2fa"
        };

        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let realPass = "********";
        let checkStatusInterval = null;

        function toggleSidebar() { closeAll(); document.getElementById('sidebar').style.display = 'block'; document.getElementById('overlay').style.display = 'block'; }
        function toggleProfile() { closeAll(); document.getElementById('profile-card').style.display = 'block'; document.getElementById('overlay').style.display = 'block'; }
        function closeAll() { document.getElementById('sidebar').style.display = 'none'; document.getElementById('profile-card').style.display = 'none'; document.getElementById('overlay').style.display = 'none'; }
        
        function openDepo() { closeAll(); document.getElementById('depo-modal-area').style.display = 'flex'; }
        function closeDepo() { document.getElementById('depo-modal-area').style.display = 'none'; clearInterval(checkStatusInterval); }

        async function prosesDeposit() {
            const amt = document.getElementById('depo-amount').value;
            const btn = document.getElementById('btn-create-depo');
            const token = localStorage.getItem('sessionToken');
            
            if(!amt || amt < 2000) return alert("minimal 2.000");
            
            btn.innerText = "tunggu..."; btn.disabled = true;

            try {
                // Gunakan path lengkap /api/depo biar Vercel nggak bingung
                const res = await fetch('/api/depo', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ action: 'create', amount: amt, userToken: token })
                });
                
                const data = await res.json();

                if(data.success) {
                    document.getElementById('qris-img').src = data.qrUrl;
                    document.getElementById('input-depo-area').style.display = 'none';
                    document.getElementById('qris-display-area').style.display = 'block';

                    checkStatusInterval = setInterval(async () => {
                        const check = await fetch('/api/depo', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ action: 'status', orderId: data.orderId || data.order_id })
                        });
                        const resStat = await check.json();
                        if(resStat.status === 'SUCCESS') {
                            clearInterval(checkStatusInterval);
                            alert("DEPOSIT BERHASIL! Saldo masuk.");
                            location.reload();
                        }
                    }, 5000);
                } else {
                    alert("Cashi sedang sibuk, coba lagi nanti.");
                    btn.innerText = "buat qris"; btn.disabled = false;
                }
            } catch(e) {
                console.error(e);
                alert("koneksi bermasalah!");
                btn.innerText = "buat qris"; btn.disabled = false;
            }
        }

        function togglePass() {
            const passElem = document.getElementById('p-pass');
            const icon = document.getElementById('pass-icon');
            if (passElem.innerText === '••••••••') {
                passElem.innerText = realPass;
                passElem.style.letterSpacing = '0px';
                icon.className = 'fa-solid fa-eye';
            } else {
                passElem.innerText = '••••••••';
                passElem.style.letterSpacing = '2px';
                icon.className = 'fa-solid fa-eye-slash';
            }
        }

        function logout() { localStorage.clear(); location.href = "login.html"; }

        async function loadData() {
            const token = localStorage.getItem('sessionToken');
            if (!token) { location.href = "login.html"; return; }

            db.ref('users/' + token).on('value', (snap) => {
                const data = snap.val();
                if (data) {
                    document.getElementById('p-name').innerText = data.fullname || "user";
                    document.getElementById('p-key').innerText = data.apiKey || "-";
                    document.getElementById('p-phone').innerText = data.phone || "-";
                    document.getElementById('p-role').innerText = data.role || "user (member)";
                    document.getElementById('user-balance').innerText = (data.balance || 0).toLocaleString('id-ID');
                    realPass = data.password || "********";
                }
            });
        }

        window.onload = loadData;
    </script>
</body>
</html>
