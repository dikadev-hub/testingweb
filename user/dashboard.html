<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="page-title">dashboard</title>
    <script src="../setting.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        @keyframes fadein { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes loading-bar { 0% { left: -40%; } 100% { left: 100%; } }
        @keyframes slide-in { from { transform: translateX(-100%); } to { transform: translateX(0); } }

        body { 
            background: #f0f4f8; 
            background-image: radial-gradient(#d1d9e6 1px, transparent 1px);
            background-size: 20px 20px;
            color: #1a1a1a; 
            font-family: 'inter', sans-serif; 
            margin: 0; 
            text-transform: lowercase; 
            overflow-x: hidden;
        }

        #loading-line {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 4px;
            background: #e2e8f0;
            z-index: 10000;
            display: none;
        }
        #loading-line::after {
            content: '';
            position: absolute;
            height: 100%; width: 40%;
            background: #007bff;
            animation: loading-bar 1.5s infinite linear;
        }

        .header {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            height: 70px;
            display: flex;
            align-items: center;
            padding: 0 20px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.05);
            border-bottom: 1px solid rgba(255,255,255,0.5);
            position: sticky;
            top: 0; z-index: 999;
        }

        .menu-toggle {
            width: 45px; height: 45px;
            background: #fff;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 1.2rem;
            color: #1e293b;
            transition: 0.3s;
        }
        .menu-toggle:hover { background: #f8fafc; border-color: #007bff; color: #007bff; }

        .sidebar {
            position: fixed;
            top: 0; left: 0;
            width: 280px; height: 100%;
            background: white;
            z-index: 10001;
            box-shadow: 20px 0 50px rgba(0,0,0,0.1);
            display: none;
            flex-direction: column;
            animation: slide-in 0.4s cubic-bezier(0.17, 0.89, 0.32, 1.28);
        }

        .sidebar-header {
            padding: 30px 20px;
            border-bottom: 1px solid #f1f5f9;
            text-align: center;
        }

        .sidebar-menu { padding: 20px; }
        .menu-item {
            padding: 15px;
            display: flex;
            align-items: center;
            border-radius: 14px;
            color: #475569;
            cursor: pointer;
            margin-bottom: 10px;
            font-weight: 600;
            transition: 0.3s;
        }
        .menu-item:hover { background: #f0f7ff; color: #007bff; }
        .menu-item i { margin-right: 15px; font-size: 1.1rem; }

        .overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.3);
            backdrop-filter: blur(4px);
            z-index: 10000;
            display: none;
        }

        .content { padding: 25px; max-width: 800px; margin: 0 auto; animation: fadein 0.6s ease-out; }

        .search-card {
            background: white;
            padding: 10px;
            border-radius: 20px;
            display: none;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            border: 1px solid #fff;
            margin-bottom: 25px;
        }
        .search-card input {
            width: 100%;
            padding: 15px;
            border: none;
            outline: none;
            background: transparent;
            font-size: 0.95rem;
            color: #1a1a1a;
        }

        .empty-state {
            text-align: center;
            margin-top: 100px;
            color: #94a3b8;
        }
        .empty-state i { font-size: 4rem; margin-bottom: 20px; color: #cbd5e1; }
    </style>
</head>
<body>

    <div id="loading-line"></div>

    <div id="overlay" class="overlay" onclick="close_menu()"></div>

    <div id="sidebar" class="sidebar">
        <div class="sidebar-header">
            <h3 style="margin:0; color:#1e293b;">menu <span class="shop-name"></span></h3>
        </div>
        <div class="sidebar-menu">
            <div class="menu-item" onclick="toggle_search()">
                <i class="fa-solid fa-magnifying-glass"></i>
                <span>cari produk</span>
            </div>
            <div class="menu-item">
                <i class="fa-solid fa-box-open"></i>
                <span>produk digital</span>
            </div>
            <div class="menu-item">
                <i class="fa-solid fa-receipt"></i>
                <span>riwayat beli</span>
            </div>
            <div class="menu-item" style="color: #ef4444;" onclick="logout()">
                <i class="fa-solid fa-right-from-bracket"></i>
                <span>keluar</span>
            </div>
        </div>
    </div>

    <div class="header">
        <div class="menu-toggle" onclick="open_menu()">
            <i class="fa-solid fa-bars-staggered"></i>
        </div>
        <div style="margin-left: 20px;">
            <div id="user-name" style="font-weight: 800; color: #1e293b; font-size: 0.9rem;">memuat...</div>
            <div style="font-size: 0.7rem; color: #64748b;">selamat datang kembali</div>
        </div>
    </div>

    <div class="content">
        <div id="search-box" class="search-card">
            <input type="text" id="pencarian" placeholder="ketik nama produk yang kamu cari...">
        </div>

        <div id="main-view" class="empty-state">
            <i class="fa-solid fa-store-slash"></i>
            <h3 style="margin:0;">dashboard masih kosong</h3>
            <p>silahkan cari produk melalui menu di samping</p>
        </div>
    </div>

    <script>
        function open_menu() {
            document.getElementById('sidebar').style.display = 'flex';
            document.getElementById('overlay').style.display = 'block';
        }

        function close_menu() {
            document.getElementById('sidebar').style.display = 'none';
            document.getElementById('overlay').style.display = 'none';
        }

        function toggle_search() {
            close_menu();
            const box = document.getElementById('search-box');
            box.style.display = 'block';
            document.getElementById('main-view').style.display = 'none';
            document.getElementById('pencarian').focus();
        }

        async function init_user() {
            const loading = document.getElementById('loading-line');
            loading.style.display = 'block';

            const token = localStorage.getItem('sessionToken');
            if (!token) {
                location.href = "login.html";
                return;
            }

            try {
                const res = await fetch('/api/user', {
                    headers: { 'Authorization': token }
                });
                const data = await res.json();
                
                if (data.success) {
                    document.getElementById('user-name').innerText = data.fullname;
                } else {
                    location.href = "login.html";
                }
            } catch (e) {
                console.log("error");
            } finally {
                setTimeout(() => { loading.style.display = 'none'; }, 800);
            }
        }

        function logout() {
            localStorage.clear();
            location.href = "login.html";
        }

        window.onload = function() {
            init_user();
            if (window.settings) {
                var els = document.getElementsByClassName('shop-name');
                for (var i = 0; i < els.length; i++) {
                    els[i].innerText = settings.namatoko;
                }
            }
        };
    </script>
</body>
</html>
