<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="page-title">dashboard</title>
    <script src="../setting.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        @keyframes fadein { from { opacity: 0; } to { opacity: 1; } }
        @keyframes slideMenu { from { transform: translateX(-20px); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
        @keyframes loading-bar { 0% { left: -40%; } 100% { left: 100%; } }

        body { 
            background: #f0f4f8; 
            background-image: radial-gradient(#d1d9e6 1px, transparent 1px);
            background-size: 20px 20px;
            color: #1a1a1a; 
            font-family: 'inter', sans-serif; 
            margin: 0; 
            text-transform: lowercase; 
            overflow-x: hidden;
        }

        #loading-line {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 3px;
            background: #e2e8f0;
            z-index: 10000;
            display: none;
        }
        #loading-line::after {
            content: '';
            position: absolute;
            height: 100%; width: 40%;
            background: #007bff;
            animation: loading-bar 1s infinite linear;
        }

        .header {
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(15px);
            height: 70px;
            display: flex;
            align-items: center;
            padding: 0 20px;
            position: sticky;
            top: 0; z-index: 999;
            border-bottom: 1px solid rgba(0,0,0,0.05);
        }

        .btn-menu {
            width: 45px; height: 45px;
            background: #fff;
            border: 1px solid #e2e8f0;
            border-radius: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: 0.3s;
            box-shadow: 0 4px 10px rgba(0,0,0,0.03);
        }
        .btn-menu:active { transform: scale(0.9); }

        .sidebar {
            position: fixed;
            top: 85px; left: 20px;
            width: 220px;
            background: white;
            border-radius: 25px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.08);
            display: none;
            flex-direction: column;
            padding: 10px;
            z-index: 1000;
            animation: slideMenu 0.4s cubic-bezier(0.18, 0.89, 0.32, 1.28);
            border: 1px solid rgba(255,255,255,0.5);
        }

        .menu-item {
            padding: 15px 20px;
            display: flex;
            align-items: center;
            border-radius: 18px;
            color: #475569;
            cursor: pointer;
            font-weight: 700;
            transition: 0.2s;
        }
        .menu-item:hover { background: #f0f7ff; color: #007bff; }
        .menu-item i { margin-right: 12px; font-size: 1rem; }

        .overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 998;
            display: none;
        }

        .content { padding: 20px; max-width: 600px; margin: 0 auto; }

        .search-wrapper {
            background: white;
            padding: 5px;
            border-radius: 20px;
            display: none;
            box-shadow: 0 10px 25px rgba(0,0,0,0.04);
            border: 1px solid #fff;
            animation: fadein 0.5s ease;
        }
        .search-wrapper input {
            width: 100%;
            padding: 15px;
            border: none;
            outline: none;
            background: transparent;
            font-size: 0.9rem;
            font-family: 'inter', sans-serif;
        }

        .welcome-box {
            text-align: center;
            margin-top: 80px;
            color: #94a3b8;
            animation: fadein 0.8s ease;
        }
    </style>
</head>
<body>

    <div id="loading-line"></div>
    <div id="overlay" class="overlay" onclick="closeMenu()"></div>

    <div class="header">
        <div class="btn-menu" onclick="toggleMenu()">
            <i class="fa-solid fa-grid-2" style="font-size: 1.1rem; color: #1e293b;"></i>
        </div>
        <div style="margin-left: 15px;">
            <div id="user-name" style="font-weight: 800; color: #1e293b; font-size: 0.95rem;">memuat...</div>
        </div>
    </div>

    <div id="sidebar" class="sidebar">
        <div class="menu-item" onclick="openSearch()">
            <i class="fa-solid fa-magnifying-glass"></i>
            <span>search produk</span>
        </div>
    </div>

    <div class="content">
        <div id="search-box" class="search-wrapper">
            <input type="text" id="pencarian" placeholder="cari sesuatu kak?">
        </div>

        <div id="main-view" class="welcome-box">
            <i class="fa-solid fa-ghost" style="font-size: 3rem; margin-bottom: 15px; opacity: 0.2;"></i>
            <p>klik menu kotak untuk mencari produk</p>
        </div>
    </div>

    <script>
        function toggleMenu() {
            const menu = document.getElementById('sidebar');
            const overlay = document.getElementById('overlay');
            const isVisible = menu.style.display === 'flex';
            
            menu.style.display = isVisible ? 'none' : 'flex';
            overlay.style.display = isVisible ? 'none' : 'block';
        }

        function closeMenu() {
            document.getElementById('sidebar').style.display = 'none';
            document.getElementById('overlay').style.display = 'none';
        }

        function openSearch() {
            closeMenu();
            document.getElementById('search-box').style.display = 'block';
            document.getElementById('main-view').style.display = 'none';
            document.getElementById('pencarian').focus();
        }

        async function loadDashboard() {
            const loader = document.getElementById('loading-line');
            loader.style.display = 'block';

            const token = localStorage.getItem('sessionToken');
            if (!token) { location.href = "login.html"; return; }

            try {
                const res = await fetch('/api/user', { headers: { 'Authorization': token } });
                const data = await res.json();
                if (data.success) {
                    document.getElementById('user-name').innerText = data.fullname;
                } else {
                    location.href = "login.html";
                }
            } catch (e) {
                document.getElementById('user-name').innerText = "error";
            } finally {
                setTimeout(() => { loader.style.display = 'none'; }, 600);
            }
        }

        window.onload = loadDashboard;
    </script>
</body>
</html>
