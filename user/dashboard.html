<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="page-title">dashboard</title>
    <script src="../setting.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        @keyframes fadein { from { opacity: 0; } to { opacity: 1; } }
        @keyframes slideUp { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        
        body { 
            background: #f0f4f8; 
            background-image: radial-gradient(#d1d9e6 1px, transparent 1px);
            background-size: 20px 20px;
            color: #1a1a1a; font-family: 'inter', sans-serif; margin: 0; text-transform: lowercase; overflow-x: hidden;
        }

        .header {
            background: rgba(255, 255, 255, 0.8); backdrop-filter: blur(15px);
            height: 75px; display: flex; align-items: center; justify-content: space-between;
            padding: 0 20px; position: sticky; top: 0; z-index: 999; border-bottom: 1px solid rgba(0,0,0,0.05);
        }

        .btn-action {
            width: 45px; height: 45px; background: #fff; border: 1px solid #e2e8f0;
            border-radius: 15px; display: flex; align-items: center; justify-content: center;
            cursor: pointer; color: #1e293b;
        }

        .content { padding: 20px; max-width: 600px; margin: 0 auto; }

        .profile-section {
            background: white; padding: 20px; border-radius: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.03); border: 1px solid #fff;
            display: flex; align-items: center; gap: 15px; margin-bottom: 15px;
        }
        .avatar { width: 50px; height: 50px; background: #1a1a1a; color: white; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 1.2rem; }
        .user-info h3 { margin: 0; font-size: 1rem; color: #1e293b; }
        .user-info p { margin: 0; font-size: 0.75rem; color: #94a3b8; font-weight: 700; }

        #bc-banner {
            background: #fff; border-radius: 20px; padding: 15px 20px;
            display: none; align-items: center; justify-content: space-between;
            box-shadow: 0 10px 25px rgba(0, 123, 255, 0.1);
            border-left: 5px solid #007bff; animation: slideUp 0.5s ease;
            margin-bottom: 25px;
        }
        .bc-text { display: flex; flex-direction: column; }
        .bc-text span { font-size: 0.6rem; font-weight: 800; color: #007bff; text-transform: uppercase; letter-spacing: 1px; }
        .bc-text h4 { margin: 2px 0 0 0; font-size: 0.85rem; color: #1e293b; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 180px; }
        .btn-read { background: #1a1a1a; color: white; border: none; padding: 8px 18px; border-radius: 12px; font-weight: 800; font-size: 0.75rem; cursor: pointer; }

        .bc-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #fff; z-index: 10000; display: none;
            flex-direction: column; animation: fadein 0.3s ease;
        }
        .bc-full-header { padding: 30px 25px 10px; display: flex; justify-content: flex-end; }
        .btn-close-bc { font-size: 2rem; color: #1e293b; cursor: pointer; }
        .bc-full-body { padding: 0 30px; }
        .bc-full-body span { font-size: 0.7rem; font-weight: 800; color: #007bff; text-transform: uppercase; }
        .bc-full-body h1 { margin: 10px 0 20px; font-size: 1.8rem; color: #1e293b; letter-spacing: -1px; line-height: 1.2; }
        .bc-full-body p { font-size: 1rem; color: #475569; line-height: 1.6; white-space: pre-wrap; }
    </style>
</head>
<body>

    <div class="header">
        <div class="btn-action"><i class="fa-solid fa-bars-staggered"></i></div>
        <div style="font-weight: 800; font-size: 0.9rem;">dashboard</div>
        <div class="btn-action"><i class="fa-solid fa-bell"></i></div>
    </div>

    <div class="content">
        <div class="profile-section">
            <div class="avatar"><i class="fa-solid fa-user"></i></div>
            <div class="user-info">
                <h3 id="p-name">memuat...</h3>
                <p id="p-role">member platinum</p>
            </div>
        </div>

        <div id="bc-banner">
            <div class="bc-text">
                <span>ada pesan baru!</span>
                <h4 id="bc-title-preview">pengumuman admin</h4>
            </div>
            <button class="btn-read" onclick="openFullBC()">baca</button>
        </div>

        <div style="text-align: center; margin-top: 50px; opacity: 0.2;">
            <i class="fa-solid fa-box-open" style="font-size: 3rem;"></i>
            <p>belum ada produk tersedia</p>
        </div>
    </div>

    <div id="bc-overlay" class="bc-overlay">
        <div class="bc-full-header">
            <div class="btn-close-bc" onclick="closeFullBC()"><i class="fa-solid fa-xmark"></i></div>
        </div>
        <div class="bc-full-body">
            <span>pesan dari admin</span>
            <h1 id="bc-full-title">judul pesan</h1>
            <p id="bc-full-msg">isi pesan lengkap di sini...</p>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDGRsCcT-7Bv_nOAybjXyuIT6Ca0IT4YTg",
            authDomain: "market-d978f.firebaseapp.com",
            databaseURL: "https://market-d978f-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "market-d978f",
            storageBucket: "market-d978f.firebasestorage.app",
            messagingSenderId: "291695486607",
            appId: "1:291695486607:web:dd860d16639b47c163f2fa"
        };

        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        function openFullBC() {
            document.getElementById('bc-overlay').style.display = 'flex';
            document.body.style.overflow = 'hidden';
        }

        function closeFullBC() {
            document.getElementById('bc-overlay').style.display = 'none';
            document.body.style.overflow = 'auto';
        }

        function listenBroadcast() {
            db.ref('broadcast').on('value', (snap) => {
                const data = snap.val();
                if (data && data.message) {
                    document.getElementById('bc-banner').style.display = 'flex';
                    document.getElementById('bc-title-preview').innerText = data.title || "pemberitahuan";
                    document.getElementById('bc-full-title').innerText = data.title || "pemberitahuan";
                    document.getElementById('bc-full-msg').innerText = data.message;
                } else {
                    document.getElementById('bc-banner').style.display = 'none';
                }
            });
        }

        async function loadUser() {
            const token = localStorage.getItem('sessionToken');
            if (!token) { location.href = "login.html"; return; }

            if (token === "admin-super-session") {
                document.getElementById('p-name').innerText = "Administrator";
            } else {
                db.ref('users/' + token).once('value', (snap) => {
                    const d = snap.val();
                    if(d) document.getElementById('p-name').innerText = d.fullname || "user";
                });
            }
            listenBroadcast();
        }

        window.onload = loadUser;
    </script>
</body>
</html>
