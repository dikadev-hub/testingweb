<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>dashboard market</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        body { margin: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; display: flex; height: 100vh; background: #0f172a; color: white; text-transform: lowercase; overflow: hidden; }
        
        .sidebar { width: 260px; background: #1e293b; display: flex; flex-direction: column; border-right: 1px solid #334155; }
        .sidebar-header { padding: 25px; font-size: 22px; font-weight: bold; color: #38bdf8; letter-spacing: 1px; border-bottom: 1px solid #334155; }
        .sidebar-menu { flex: 1; padding: 15px; }
        
        .menu-item { padding: 14px 18px; display: flex; align-items: center; cursor: pointer; border-radius: 12px; transition: 0.3s; margin-bottom: 8px; color: #94a3b8; }
        .menu-item:hover { background: #334155; color: white; }
        .menu-item i { margin-right: 15px; width: 20px; font-size: 18px; }
        .menu-item.active { background: #0284c7; color: white; }

        .main-content { flex: 1; display: flex; flex-direction: column; background: #0f172a; position: relative; }
        .top-nav { height: 70px; background: #1e293b; display: flex; align-items: center; justify-content: space-between; padding: 0 30px; border-bottom: 1px solid #334155; }
        
        #content-area { flex: 1; padding: 30px; overflow-y: auto; display: flex; flex-direction: column; align-items: center; }

        .search-wrapper { width: 100%; max-width: 700px; display: none; margin-bottom: 30px; animation: fadeInDown 0.4s ease; }
        .search-bar { width: 100%; display: flex; align-items: center; background: #334155; border-radius: 15px; padding: 5px 15px; border: 1px solid #475569; }
        .search-bar input { flex: 1; background: transparent; border: none; padding: 12px; color: white; outline: none; font-size: 16px; }
        .search-bar i { color: #94a3b8; }

        .empty-state { margin-top: 100px; text-align: center; color: #475569; }
        .empty-state i { font-size: 80px; margin-bottom: 20px; display: block; }

        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div class="sidebar">
        <div class="sidebar-header">market dika</div>
        <div class="sidebar-menu">
            <div class="menu-item" onclick="showSearch()">
                <i class="fa-solid fa-magnifying-glass"></i>
                <span>search produk</span>
            </div>
            <div class="menu-item">
                <i class="fa-solid fa-layer-group"></i>
                <span>kategori</span>
            </div>
            <div class="menu-item">
                <i class="fa-solid fa-cart-shopping"></i>
                <span>keranjang</span>
            </div>
            <div class="menu-item">
                <i class="fa-solid fa-wallet"></i>
                <span>saldo</span>
            </div>
        </div>
    </div>

    <div class="main-content">
        <div class="top-nav">
            <div id="user-info">
                <span id="user-name" style="font-weight: 600; color: #f1f5f9;">memuat...</span>
            </div>
            <div class="nav-icons">
                <i class="fa-solid fa-bell" style="cursor:pointer; color: #94a3b8;"></i>
            </div>
        </div>

        <div id="content-area">
            <div id="search-wrapper" class="search-wrapper">
                <div class="search-bar">
                    <i class="fa-solid fa-magnifying-glass"></i>
                    <input type="text" id="search-input" placeholder="cari produk yang kamu inginkan...">
                </div>
            </div>

            <div id="main-display" class="empty-state">
                <i class="fa-solid fa-store"></i>
                <h2 style="margin: 0;">dashboard kosong</h2>
                <p>pilih menu pencarian untuk mencari produk</p>
            </div>
        </div>
    </div>

    <script>
        function showSearch() {
            const searchWrap = document.getElementById('search-wrapper');
            const mainDisplay = document.getElementById('main-display');
            
            searchWrap.style.display = "block";
            mainDisplay.style.display = "none";
            document.getElementById('search-input').focus();
        }

        async function initDashboard() {
            const token = localStorage.getItem('sessionToken');
            if (!token) {
                window.location.href = "../login.html";
                return;
            }

            try {
                const res = await fetch('/api/user', {
                    method: 'GET',
                    headers: { 'Authorization': token }
                });
                const data = await res.json();

                if (data.success) {
                    document.getElementById('user-name').innerText = "halo, " + data.fullname;
                } else {
                    localStorage.clear();
                    window.location.href = "../login.html";
                }
            } catch (e) {
                document.getElementById('user-name').innerText = "error koneksi";
            }
        }

        initDashboard();
    </script>
</body>
</html>
