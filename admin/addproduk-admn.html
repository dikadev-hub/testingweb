<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>admin | tertinggi</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        body { 
            background: #050505; color: #ffffff; font-family: 'inter', sans-serif; 
            margin: 0; padding: 20px; text-transform: lowercase; padding-bottom: 100px;
        }
        .container { max-width: 500px; margin: 0 auto; }
        .card { background: #111; padding: 25px; border-radius: 30px; border: 1px solid #222; }
        
        .badge-boss {
            background: linear-gradient(90deg, #ff0000, #550000);
            padding: 15px; border-radius: 20px; margin-bottom: 25px;
            text-align: center; font-weight: 900; letter-spacing: 1px;
            box-shadow: 0 0 20px rgba(255, 0, 0, 0.2); border: 1px solid #ff0000;
        }

        /* multi image grid */
        .image-grid { 
            display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 20px; 
        }
        .img-slot { 
            aspect-ratio: 1/1; background: #000; border: 2px dashed #333; 
            border-radius: 15px; display: flex; align-items: center; justify-content: center;
            overflow: hidden; cursor: pointer; position: relative;
        }
        .img-slot img { width: 100%; height: 100%; object-fit: cover; }
        .img-slot i { color: #ff0000; font-size: 1.5rem; }

        label { display: block; font-size: 0.65rem; font-weight: 800; color: #ff0000; margin-bottom: 8px; margin-top: 15px; letter-spacing: 1px; }
        input, textarea, select { 
            width: 100%; padding: 15px; border-radius: 15px; border: 1px solid #222; 
            background: #000; outline: none; font-family: inherit; box-sizing: border-box; 
            color: #fff; font-weight: 600; font-size: 0.85rem; transition: 0.3s;
        }
        input:focus { border-color: #ff0000; }

        .secret-box { background: #0a0000; border: 1px solid #440000; padding: 20px; border-radius: 20px; margin-top: 25px; }
        
        .action-area { position: fixed; bottom: 0; left: 0; width: 100%; padding: 20px; box-sizing: border-box; background: rgba(5,5,5,0.8); backdrop-filter: blur(10px); }
        .btn-submit { width: 100%; max-width: 460px; margin: 0 auto; display: block; padding: 20px; background: #ff0000; color: white; border: none; border-radius: 20px; font-weight: 900; cursor: pointer; text-transform: lowercase; }
        
        #loading-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9); z-index: 1000; display: none;
            flex-direction: column; align-items: center; justify-content: center;
        }
    </style>
</head>
<body>

<div id="loading-overlay">
    <i class="fa-solid fa-skull-crossbones fa-spin" style="font-size: 3rem; color: #ff0000;"></i>
    <p id="loading-text" style="margin-top: 20px; font-weight: 800; font-size: 0.8rem;">mengunggah foto...</p>
</div>

<div class="container">
    <div class="badge-boss">
        TERTINGGI DI WEBSITE INI 😼
    </div>

    <div class="card">
        <label>album produk (bisa banyak foto) :</label>
        <div class="image-grid" id="preview-container">
            <div class="img-slot" onclick="document.getElementById('file-input').click()">
                <i class="fa-solid fa-plus"></i>
            </div>
        </div>
        <input type="file" id="file-input" hidden multiple accept="image/*" onchange="previewFiles(this)">

        <label>nama produk :</label>
        <input type="text" id="nama-produk" placeholder="masukkan nama produk">

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px;">
            <div>
                <label>harga awal :</label>
                <input type="number" id="harga-awal" oninput="hitung()">
            </div>
            <div>
                <label>diskon (%) :</label>
                <input type="number" id="diskon" value="0" oninput="hitung()">
            </div>
        </div>

        <label>harga jual :</label>
        <input type="number" id="harga-final" readonly style="color: #ff0000;">

        <label>stok :</label>
        <input type="number" id="stok" value="999">

        <label>deskripsi lengkap :</label>
        <textarea id="desc" rows="4"></textarea>

        <div class="secret-box">
            <label>email/user :</label>
            <input type="text" id="acc-email">
            <label>password :</label>
            <input type="text" id="acc-pass">
            <label>catatan :</label>
            <textarea id="acc-note" rows="2"></textarea>
        </div>
    </div>
</div>

<div class="action-area">
    <button class="btn-submit" onclick="uploadSemua()">posting sekarang</button>
</div>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>

<script>
    const firebaseconfig = {
        apiKey: "AIzaSyDGRsCcT-7Bv_nOAybjXyuIT6Ca0IT4YTg",
        databaseURL: "https://market-d978f-default-rtdb.asia-southeast1.firebasedatabase.app",
        projectId: "market-d978f",
    };
    firebase.initializeApp(firebaseconfig);
    const db = firebase.database();

    let selectedFiles = [];

    function previewFiles(input) {
        if (input.files) {
            const files = Array.from(input.files);
            selectedFiles = selectedFiles.concat(files);
            renderPreview();
        }
    }

    function renderPreview() {
        const container = document.getElementById('preview-container');
        container.innerHTML = selectedFiles.map((file, i) => `
            <div class="img-slot" onclick="removeImg(${i})">
                <img src="${URL.createObjectURL(file)}">
            </div>
        `).join('') + `
            <div class="img-slot" onclick="document.getElementById('file-input').click()">
                <i class="fa-solid fa-plus"></i>
            </div>
        `;
    }

    function removeImg(i) {
        selectedFiles.splice(i, 1);
        renderPreview();
    }

    function hitung() {
        const awal = parseFloat(document.getElementById('harga-awal').value) || 0;
        const disc = parseFloat(document.getElementById('diskon').value) || 0;
        document.getElementById('harga-final').value = Math.round(awal - (awal * disc / 100));
    }

    async function uploadSemua() {
        if(selectedFiles.length === 0) return alert("foto mana?");
        
        const overlay = document.getElementById('loading-overlay');
        const loadText = document.getElementById('loading-text');
        overlay.style.display = 'flex';

        try {
            let uploadedUrls = [];
            for(let i=0; i < selectedFiles.length; i++) {
                loadText.innerText = `mengunggah foto ke-${i+1}...`;
                const formData = new FormData();
                formData.append("image", selectedFiles[i]);
                
                const res = await fetch("https://api.imgbb.com/1/upload?key=50145b1eaa1385c3d9549ebe496eb5b5", {
                    method: "POST",
                    body: formData
                }).then(r => r.json());
                
                if(res.success) uploadedUrls.push(res.data.url);
            }

            const id = "prd-" + Date.now();
            await db.ref('products/' + id).set({
                productId: id,
                nama: document.getElementById('nama-produk').value,
                foto: uploadedUrls[0], // Foto utama
                album: uploadedUrls,    // Semua foto untuk slider
                harga: parseInt(document.getElementById('harga-final').value),
                stok: parseInt(document.getElementById('stok').value),
                deskripsi: document.getElementById('desc-produk').value || document.getElementById('desc').value,
                uploadBy: "TERTINGGI DI WEBSITE INI 😼",
                status: "active",
                timestamp: Date.now(),
                akun: {
                    email: document.getElementById('acc-email').value,
                    pass: document.getElementById('acc-pass').value,
                    tambahan: document.getElementById('acc-note').value
                }
            });

            alert("berhasil terposting");
            location.reload();

        } catch (e) {
            alert(e.message);
        } finally {
            overlay.style.display = 'none';
        }
    }
</script>
</body>
</html>
