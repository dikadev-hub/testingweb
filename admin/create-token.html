<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>create token admin</title>
    <script src="../setting.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        body { 
            background: #f0f4f8; 
            color: #1a1a1a; 
            font-family: 'inter', sans-serif; 
            margin: 0; padding: 20px;
            text-transform: lowercase;
            display: flex; justify-content: center; align-items: center; min-height: 100vh;
        }
        .container {
            width: 100%; max-width: 400px;
            background: white; padding: 30px; border-radius: 30px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.05); border: 1px solid #fff;
        }
        .header-page { display: flex; align-items: center; justify-content: space-between; margin-bottom: 30px; }
        .btn-back {
            width: 40px; height: 40px; background: #fff; border: 1px solid #e2e8f0;
            border-radius: 12px; display: flex; align-items: center; justify-content: center;
            cursor: pointer; color: #1e293b; text-decoration: none;
        }
        h2 { margin: 0; font-size: 1rem; font-weight: 900; color: #1e293b; text-align: center; flex: 1; }
        .form-group { margin-bottom: 20px; }
        label { 
            display: block; font-size: 0.65rem; font-weight: 800; color: #94a3b8; 
            text-transform: uppercase; margin-bottom: 8px; letter-spacing: 0.5px;
        }
        .user-list-select {
            max-height: 200px; overflow-y: auto; border: 1px solid #e2e8f0;
            border-radius: 15px; padding: 5px; margin-bottom: 10px; background: #f8fafc;
        }
        .user-option {
            display: flex; align-items: center; padding: 12px;
            cursor: pointer; border-radius: 10px; transition: 0.2s;
        }
        .user-option:hover { background: #fff; box-shadow: 0 4px 10px rgba(0,0,0,0.02); }
        .user-option input[type="checkbox"] {
            margin-right: 12px; width: 18px; height: 18px;
            cursor: pointer; accent-color: #007bff;
        }
        .user-info { display: flex; flex-direction: column; }
        .user-info .name { font-size: 0.8rem; font-weight: 700; color: #1e293b; }
        .user-info .phone { font-size: 0.65rem; color: #94a3b8; }
        input[type="number"] {
            width: 100%; padding: 15px; border-radius: 15px; border: 1px solid #e2e8f0;
            background: #f8fafc; outline: none; font-family: inherit;
            font-weight: 600; font-size: 0.85rem; box-sizing: border-box;
        }
        .btn-submit {
            width: 100%; padding: 15px; background: #1a1a1a; color: white;
            border: none; border-radius: 15px; font-weight: 800; font-size: 0.8rem;
            cursor: pointer; transition: 0.3s; text-transform: uppercase; margin-top: 10px;
        }
        .btn-submit:hover { background: #007bff; transform: translateY(-2px); }
        #loading-line {
            width: 100%; height: 3px; background: #e2e8f0; position: relative;
            overflow: hidden; margin-bottom: 20px; display: none;
        }
        #loading-line::after {
            content: ''; position: absolute; height: 100%; width: 40%;
            background: #007bff; animation: loading 1s infinite linear;
        }
        @keyframes loading { 0% { left: -40%; } 100% { left: 100%; } }
    </style>
</head>
<body>
    <div class="container">
        <div class="header-page">
            <a href="dashboard.html" class="btn-back"><i class="fa-solid fa-arrow-left"></i></a>
            <h2>create token admin</h2>
            <div style="width: 40px;"></div>
        </div>
        <div id="loading-line"></div>
        <div class="form-group">
            <label>pilih owner / admin :</label>
            <div id="user-selector" class="user-list-select">
                <div style="padding: 20px; text-align: center; font-size: 0.7rem; color: #94a3b8;">memuat data...</div>
            </div>
        </div>
        <div class="form-group">
            <label>masukan limit untuk admin menjual produk :</label>
            <input type="number" id="token-limit" placeholder="contoh: 50">
        </div>
        <button class="btn-submit" onclick="generateToken()">buat token & limit</button>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>

    <script>
        // Konfigurasi Firebase (Samain sama dashboard lo koo)
        const firebaseConfig = {
            apiKey: "AIzaSyDGRsCcT-7Bv_nOAybjXyuIT6Ca0IT4YTg",
            databaseURL: "https://market-d978f-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "market-d978f",
        };
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        // Load data User yang rolenya 'owner'
        function loadOwners() {
            const container = document.getElementById('user-selector');
            db.ref('users').orderByChild('role').equalTo('owner').on('value', (snap) => {
                container.innerHTML = "";
                if (snap.exists()) {
                    snap.forEach(child => {
                        const u = child.val();
                        const key = child.key;
                        container.innerHTML += `
                            <div class="user-option">
                                <input type="checkbox" id="check-${key}" value="${key}" name="owner-select">
                                <div class="user-info" onclick="document.getElementById('check-${key}').click()">
                                    <span class="name">${u.fullname}</span>
                                    <span class="phone">${u.phone || '-'}</span>
                                </div>
                            </div>
                        `;
                    });
                } else {
                    container.innerHTML = '<div style="padding: 20px; text-align: center; font-size: 0.7rem; color: #ef4444;">tidak ada owner ditemukan</div>';
                }
            });
        }

        // Fungsi Simpan Limit
        function generateToken() {
            const selected = document.querySelectorAll('input[name="owner-select"]:checked');
            const limit = document.getElementById('token-limit').value;
            const loader = document.getElementById('loading-line');

            if (selected.length === 0) return alert("pilih minimal satu owner!");
            if (!limit || limit <= 0) return alert("masukan limit yang valid!");

            loader.style.display = 'block';

            let updates = {};
            selected.forEach(input => {
                const userId = input.value;
                // Simpan limit ke node user masing-masing
                updates[`users/${userId}/saleLimit`] = parseInt(limit);
            });

            db.ref().update(updates)
                .then(() => {
                    alert("berhasil! limit penjualan telah diupdate.");
                    location.href = 'dashboard.html';
                })
                .catch(err => alert("gagal: " + err.message))
                .finally(() => loader.style.display = 'none');
        }

        window.onload = loadOwners;
    </script>
</body>
</html>
