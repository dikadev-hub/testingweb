<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>admin panel</title>
    <script src="../setting.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        @keyframes fadein { from { opacity: 0; } to { opacity: 1; } }
        @keyframes slideDown { from { transform: translateY(-10px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        
        body { 
            background: #f0f4f8; 
            background-image: radial-gradient(#d1d9e6 1px, transparent 1px);
            background-size: 20px 20px;
            color: #1a1a1a; font-family: 'inter', sans-serif; margin: 0; text-transform: lowercase;
        }

        .header {
            background: rgba(255, 255, 255, 0.8); backdrop-filter: blur(15px);
            height: 75px; display: flex; align-items: center; justify-content: space-between;
            padding: 0 20px; position: sticky; top: 0; z-index: 999; border-bottom: 1px solid rgba(0,0,0,0.05);
        }

        .btn-action {
            width: 45px; height: 45px; background: #fff; border: 1px solid #e2e8f0;
            border-radius: 15px; display: flex; align-items: center; justify-content: center;
            cursor: pointer; color: #1e293b;
        }

        .sidebar-box {
            position: absolute; top: 85px; left: 20px; width: 220px;
            background: rgba(255, 255, 255, 0.95); border-radius: 20px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.1); display: none; z-index: 1001;
            animation: slideDown 0.3s ease; border: 1px solid rgba(255, 255, 255, 0.5); overflow: hidden;
        }

        .profile-box {
            position: absolute; top: 85px; right: 20px; width: 280px;
            background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(15px);
            border-radius: 25px; box-shadow: 0 15px 40px rgba(0,0,0,0.1);
            display: none; padding: 25px; z-index: 1001; animation: slideDown 0.3s ease;
        }

        .sidebar-title { padding: 15px 20px; font-size: 0.7rem; font-weight: 800; color: #94a3b8; text-transform: uppercase; border-bottom: 1px solid rgba(0,0,0,0.03); }
        .menu-item { padding: 12px 20px; display: flex; align-items: center; color: #475569; cursor: pointer; font-weight: 700; }
        .menu-item:hover { background: rgba(0, 123, 255, 0.05); color: #007bff; }
        .menu-item i { margin-right: 12px; font-size: 0.9rem; }

        .info-label { font-size: 0.65rem; font-weight: 800; color: #64748b; text-transform: uppercase; margin-top: 15px; display: block; }
        .info-value { font-size: 0.85rem; font-weight: 600; color: #1e293b; display: block; margin-top: 2px; }

        .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 20px; }
        .stat-card { background: white; padding: 15px; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.03); border: 1px solid #fff; text-align: center; }
        .stat-card i { font-size: 1rem; color: #007bff; margin-bottom: 5px; }
        .stat-card h3 { margin: 5px 0; font-size: 1.2rem; color: #1e293b; }
        .stat-card p { margin: 0; font-size: 0.6rem; font-weight: 800; color: #94a3b8; text-transform: uppercase; }

        .form-card { background: white; padding: 25px; border-radius: 25px; box-shadow: 0 10px 25px rgba(0,0,0,0.04); margin-top: 10px; display: none; }
        .input-group { margin-bottom: 15px; }
        .input-group label { display: block; font-size: 0.7rem; font-weight: 800; color: #64748b; text-transform: uppercase; margin-bottom: 8px; }
        .input-group input, .input-group textarea { width: 100%; padding: 15px; background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 15px; outline: none; font-family: inherit; box-sizing: border-box; }
        
        .btn-flex { display: flex; gap: 10px; margin-top: 10px; }
        .btn-main { width: 100%; padding: 15px; background: #1a1a1a; color: white; border: none; border-radius: 15px; font-weight: 800; cursor: pointer; }
        .btn-del { width: 40%; background: #fee2e2; color: #ef4444; border: none; border-radius: 15px; font-weight: 800; cursor: pointer; }
        
        .overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 1000; display: none; }
        .content { padding: 20px; max-width: 600px; margin: 0 auto; }
    </style>
</head>
<body>

    <div id="overlay" class="overlay" onclick="closeAll()"></div>

    <div class="header">
        <div class="btn-action" onclick="toggleSidebar()">
            <i class="fa-solid fa-screwdriver-wrench"></i>
        </div>
        <div style="font-weight: 800; font-size: 0.9rem;">admin panel</div>
        <div class="btn-action" onclick="toggleProfile()">
            <i class="fa-solid fa-user-shield"></i>
        </div>
    </div>

    <div id="sidebar" class="sidebar-box">
        <div class="sidebar-title">admin menu</div>
        <div class="menu-item" onclick="showBC()">
            <i class="fa-solid fa-bullhorn"></i>
            <span>kirim broadcast</span>
        </div>
        <div class="sidebar-title">manajemen User</div>
        <div class="menu-item" onclick="openPendingRequest()">
            <i class="fa-solid fa-clock-rotate-left"></i>
            <span>request masuk</span>
        </div>
        <div class="menu-item" onclick="location.href='../user/dashboard.html'">
            <i class="fa-solid fa-eye"></i>
            <span>login user</span>
        </div>
    </div>

    <div id="profile-card" class="profile-box">
        <span class="info-label">nama admin :</span>
        <span class="info-value">admin</span>
        <span class="info-label">role akses :</span>
        <span class="info-value" style="color: #007bff;">Super Administrator</span>
        <span class="info-label">status :</span>
        <span class="info-value">online / active</span>
        <button class="btn-main" style="margin-top: 20px; background: #ef4444;" onclick="logout()">logout</button>
    </div>

    <div class="content">
        <div class="stats-grid">
            <div class="stat-card">
                <i class="fa-solid fa-users"></i>
                <h3 id="total-users">0</h3>
                <p>total user</p>
            </div>
            <div class="stat-card">
                <i class="fa-solid fa-box"></i>
                <h3>0</h3>
                <p>total produk</p>
            </div>
            <div class="stat-card">
                <i class="fa-solid fa-user-tie"></i>
                <h3 id="total-owner">0</h3>
                <p>total owner</p>
            </div>
            <div class="stat-card">
                <i class="fa-solid fa-cart-shopping"></i>
                <h3>0</h3>
                <p>total penjualan</p>
            </div>
        </div>

        <div id="admin-request-page" class="form-card" style="margin-top: 0;">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
                <div class="sidebar-title" style="padding: 0; border: none;">antrian request owner</div>
                <button onclick="hideRequestPage()" style="background: #f1f5f9; border: none; width: 30px; height: 30px; border-radius: 8px; cursor: pointer;"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div id="list-request-container"></div>
        </div>

        <div id="bc-form" class="form-card">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
                <div class="sidebar-title" style="padding: 0; border: none;">buat broadcast</div>
                <button onclick="hideBC()" style="background: #f1f5f9; border: none; width: 30px; height: 30px; border-radius: 8px; cursor: pointer;"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div class="input-group">
                <label>nama info :</label>
                <input type="text" id="bc-title" placeholder="contoh: info maintenance">
            </div>
            <div class="input-group">
                <label>isi :</label>
                <textarea id="bc-msg" rows="4" placeholder="tulis pesan anda..."></textarea>
            </div>
            <div class="btn-flex">
                <button class="btn-main" onclick="sendBC()">luncurkan 🚀</button>
                <button class="btn-del" onclick="deleteBC()">🗑️</button>
            </div>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDGRsCcT-7Bv_nOAybjXyuIT6Ca0IT4YTg",
            authDomain: "market-d978f.firebaseapp.com",
            databaseURL: "https://market-d978f-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "market-d978f",
            storageBucket: "market-d978f.firebasestorage.app",
            messagingSenderId: "291695486607",
            appId: "1:291695486607:web:dd860d16639b47c163f2fa"
        };

        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        function closeAll() {
            document.getElementById('sidebar').style.display = 'none';
            document.getElementById('profile-card').style.display = 'none';
            document.getElementById('overlay').style.display = 'none';
        }

        function toggleSidebar() { 
            const sb = document.getElementById('sidebar');
            if(sb.style.display === 'block') {
                closeAll();
            } else {
                closeAll();
                sb.style.display = 'block';
                document.getElementById('overlay').style.display = 'block';
            }
        }

        function toggleProfile() { 
            const pc = document.getElementById('profile-card');
            if(pc.style.display === 'block') {
                closeAll();
            } else {
                closeAll();
                pc.style.display = 'block';
                document.getElementById('overlay').style.display = 'block';
            }
        }
        
        function showBC() { 
            document.getElementById('admin-request-page').style.display = 'none';
            document.getElementById('bc-form').style.display = 'block'; 
            closeAll(); 
        }

        function hideBC() {
            document.getElementById('bc-form').style.display = 'none';
        }

        function openPendingRequest() {
            document.getElementById('bc-form').style.display = 'none';
            document.getElementById('admin-request-page').style.display = 'block';
            loadRequests();
            closeAll();
        }

        function hideRequestPage() {
            document.getElementById('admin-request-page').style.display = 'none';
        }

        function loadRequests() {
            const container = document.getElementById('list-request-container');
            db.ref('role_requests').on('value', (snap) => {
                container.innerHTML = "";
                if (!snap.exists()) {
                    container.innerHTML = "<p style='text-align:center; color:#94a3b8; margin-top:20px;'>tidak ada request masuk</p>";
                    return;
                }
                snap.forEach((child) => {
                    const data = child.val();
                    const key = child.key;
                    container.innerHTML += `
                        <div style="background:#f8fafc; padding:20px; border-radius:20px; border:1px solid #e2e8f0; margin-bottom:15px;">
                            <span style="font-size: 0.6rem; font-weight: 800; color: #007bff; text-transform: uppercase;">REQUEST OWNER</span>
                            <div style="margin-top: 10px;">
                                <span class="info-label">NAMA :</span> <span class="info-value">${data.name}</span>
                                <span class="info-label">NOMOR :</span> <span class="info-value">${data.phone}</span>
                                <span class="info-label">EMAIL :</span> <span class="info-value">${data.email}</span>
                                <span class="info-label">ALASAN :</span> <span class="info-value" style="white-space: pre-wrap; background:#fff; padding:10px; border-radius:10px; border:1px solid #e2e8f0; margin-top:5px;">${data.desc}</span>
                            </div>
                            <div class="btn-flex" style="margin-top:15px;">
                                <button onclick="processRole('${key}', 'tolak')" style="flex:1; padding:12px; border-radius:12px; border:none; background:#fee2e2; color:#ef4444; font-weight:800; cursor:pointer;">tolak</button>
                                <button onclick="processRole('${key}', 'terima')" style="flex:1; padding:12px; border-radius:12px; border:none; background:#dcfce7; color:#22c55e; font-weight:800; cursor:pointer;">terima</button>
                            </div>
                        </div>
                    `;
                });
            });
        }

        async function processRole(userKey, action) {
            try {
                if (action === 'terima') {
                    await db.ref('users/' + userKey).update({ role: 'owner' });
                    alert("user berhasil menjadi owner! ✅");
                } else {
                    alert("request ditolak ❌");
                }
                await db.ref('role_requests/' + userKey).remove();
            } catch (e) { alert("gagal memproses"); }
        }

        function listenStats() {
            db.ref('users').on('value', (snap) => {
                document.getElementById('total-users').innerText = snap.numChildren();
                
                let countOwner = 0;
                snap.forEach((child) => {
                    if (child.val().role === 'owner') {
                        countOwner++;
                    }
                });
                
                const ownerElem = document.getElementById('total-owner');
                if(ownerElem) ownerElem.innerText = countOwner;
            });
        }

        async function sendBC() {
            const title = document.getElementById('bc-title').value;
            const message = document.getElementById('bc-msg').value;
            if(!title || !message) return alert("lengkapi data");
            await db.ref('broadcast').set({ title, message });
            alert("broadcast terkirim secara real-time! 🚀");
            document.getElementById('bc-title').value = "";
            document.getElementById('bc-msg').value = "";
        }

        async function deleteBC() {
            if(confirm("hapus broadcast?")) {
                await db.ref('broadcast').remove();
                alert("broadcast dihapus 🗑️");
            }
        }

        function logout() {
            localStorage.clear();
            location.href = "../login.html";
        }

        window.onload = () => {
            listenStats();
        };
    </script>
</body>
</html>
