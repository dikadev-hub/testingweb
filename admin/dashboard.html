<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="page-title">admin panel</title>
    <script src="../setting.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        @keyframes fadein { from { opacity: 0; } to { opacity: 1; } }
        @keyframes slideDown { from { transform: translateY(-10px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        @keyframes loading-bar { 0% { left: -40%; } 100% { left: 100%; } }

        body { 
            background: #f0f4f8; 
            background-image: radial-gradient(#d1d9e6 1px, transparent 1px);
            background-size: 20px 20px;
            color: #1a1a1a; 
            font-family: 'inter', sans-serif; 
            margin: 0; 
            text-transform: lowercase; 
            overflow-x: hidden;
        }

        #loading-line {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 3px;
            background: #e2e8f0;
            z-index: 10000;
            display: none;
        }
        #loading-line::after {
            content: '';
            position: absolute;
            height: 100%; width: 40%;
            background: #007bff;
            animation: loading-bar 1s infinite linear;
        }

        .header {
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(15px);
            height: 75px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            position: sticky;
            top: 0; z-index: 999;
            border-bottom: 1px solid rgba(0,0,0,0.05);
        }

        .btn-action {
            width: 45px; height: 45px;
            background: #fff;
            border: 1px solid #e2e8f0;
            border-radius: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            color: #1e293b;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 25px;
        }

        .stat-card {
            background: white;
            padding: 20px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.03);
            border: 1px solid #fff;
        }

        .stat-card span { display: block; font-size: 0.65rem; font-weight: 800; color: #94a3b8; text-transform: uppercase; margin-bottom: 5px; }
        .stat-card h3 { margin: 0; font-size: 1.2rem; color: #1e293b; }

        .sidebar-box {
            position: absolute;
            top: 85px; left: 20px;
            width: 220px;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.1);
            display: none;
            z-index: 1001;
            animation: slideDown 0.3s ease;
            border: 1px solid rgba(255, 255, 255, 0.5);
            overflow: hidden;
        }

        .sidebar-title { padding: 15px 20px; font-size: 0.7rem; font-weight: 800; color: #94a3b8; text-transform: uppercase; border-bottom: 1px solid rgba(0,0,0,0.03); }

        .menu-item { padding: 12px 20px; display: flex; align-items: center; color: #475569; cursor: pointer; font-weight: 700; }
        .menu-item:hover { background: rgba(0, 123, 255, 0.05); color: #007bff; }
        .menu-item i { margin-right: 12px; font-size: 0.9rem; }

        .content { padding: 20px; max-width: 600px; margin: 0 auto; }

        .form-card {
            background: white;
            padding: 25px;
            border-radius: 25px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.04);
            display: none;
            animation: fadein 0.5s ease;
        }

        .input-group { margin-bottom: 15px; }
        .input-group label { display: block; font-size: 0.7rem; font-weight: 800; color: #64748b; text-transform: uppercase; margin-bottom: 8px; }
        .input-group input, .input-group textarea {
            width: 100%; padding: 15px; background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 15px; outline: none; font-family: inherit; box-sizing: border-box;
        }

        .btn-main { width: 100%; padding: 15px; background: #1a1a1a; color: white; border: none; border-radius: 15px; font-weight: 800; cursor: pointer; margin-top: 10px; }
        .btn-delete { width: 100%; padding: 15px; background: #fff; color: #ef4444; border: 1px solid #fee2e2; border-radius: 15px; font-weight: 800; cursor: pointer; margin-top: 10px; }

        .overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 1000; display: none; }
        
        .welcome-text { text-align: center; margin-top: 50px; color: #94a3b8; }
    </style>
</head>
<body>

    <div id="loading-line"></div>
    <div id="overlay" class="overlay" onclick="closeAll()"></div>

    <div class="header">
        <div class="btn-action" onclick="toggleSidebar()">
            <i class="fa-solid fa-screwdriver-wrench"></i>
        </div>
        <div style="font-weight: 800; font-size: 0.95rem;">admin panel</div>
        <div class="btn-action" onclick="location.href='dashboard.html'">
            <i class="fa-solid fa-house"></i>
        </div>
    </div>

    <div id="sidebar" class="sidebar-box">
        <div class="sidebar-title">setting</div>
        <div class="menu-item" onclick="showSection('broadcast-box')">
            <i class="fa-solid fa-bullhorn"></i>
            <span>broadcast</span>
        </div>
    </div>

    <div class="content">
        <div class="stats-grid">
            <div class="stat-card">
                <span>total user</span>
                <h3 id="stat-user">0</h3>
            </div>
            <div class="stat-card">
                <span>total produk</span>
                <h3 id="stat-product">0</h3>
            </div>
        </div>

        <div id="broadcast-box" class="form-card">
            <div class="input-group">
                <label>judul bc</label>
                <input type="text" id="bc-title" placeholder="masukkan judul...">
            </div>
            <div class="input-group">
                <label>pesan</label>
                <textarea id="bc-msg" placeholder="ketik pesan broadcast..."></textarea>
            </div>
            <button class="btn-main" onclick="saveBroadcast()">kirim broadcast</button>
            <button class="btn-delete" onclick="deleteBroadcast()">hapus bc</button>
        </div>

        <div id="main-status" class="welcome-text">
            <i class="fa-solid fa-user-shield" style="font-size: 3rem; opacity: 0.1; margin-bottom: 15px; display: block;"></i>
            <span>pilih menu setting di sidebar</span>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyBkegfgE0pKI35bV7Fu0N6soHNeZP-0p74",
            authDomain: "lapakdika.firebaseapp.com",
            databaseURL: "https://lapakdika-default-rtdb.asia-southeast1.firebasedatabase.app/",
            projectId: "lapakdika",
            storageBucket: "lapakdika.firebasestorage.app",
            messagingSenderId: "910780517029",
            appId: "1:910780517029:web:8ae964a78f55bb91db5b4c",
            measurementId: "G-1TS0VPD7KC"
        };

        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        function toggleSidebar() {
            const sb = document.getElementById('sidebar');
            const isVisible = sb.style.display === 'block';
            closeAll();
            if (!isVisible) {
                sb.style.display = 'block';
                document.getElementById('overlay').style.display = 'block';
            }
        }

        function closeAll() {
            document.getElementById('sidebar').style.display = 'none';
            document.getElementById('overlay').style.display = 'none';
        }

        function showSection(id) {
            closeAll();
            document.getElementById('main-status').style.display = 'none';
            document.getElementById('broadcast-box').style.display = 'block';
        }

        async function saveBroadcast() {
            const title = document.getElementById('bc-title').value;
            const msg = document.getElementById('bc-msg').value;
            if(!title || !msg) return alert("lengkapi data bc dulu");

            try {
                await db.ref('broadcast').set({
                    title: title,
                    message: msg,
                    active: true
                });
                alert("broadcast berhasil dikirim ke semua user!");
            } catch (e) {
                alert("gagal kirim bc: " + e.message);
            }
        }

        async function deleteBroadcast() {
            try {
                await db.ref('broadcast').remove();
                document.getElementById('bc-title').value = "";
                document.getElementById('bc-msg').value = "";
                alert("broadcast telah dihapus!");
            } catch (e) {
                alert("gagal hapus");
            }
        }

        window.onload = function() {
            // Load data stats sederhana
            db.ref('users').on('value', snap => {
                document.getElementById('stat-user').innerText = snap.numChildren() || 0;
            });
            // Load data BC yang sudah ada
            db.ref('broadcast').once('value', snap => {
                const data = snap.val();
                if(data) {
                    document.getElementById('bc-title').value = data.title;
                    document.getElementById('bc-msg').value = data.message;
                }
            });
        };
    </script>
</body>
</html>
