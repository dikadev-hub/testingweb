<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>admin panel - sat store</title>
    <script src="../setting.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        @keyframes fadein { from { opacity: 0; } to { opacity: 1; } }
        @keyframes slideDown { from { transform: translateY(-10px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        
        body { 
            background: #f0f4f8; 
            background-image: radial-gradient(#d1d9e6 1px, transparent 1px);
            background-size: 20px 20px;
            color: #1a1a1a; font-family: 'inter', sans-serif; margin: 0; text-transform: lowercase;
        }

        .header {
            background: rgba(255, 255, 255, 0.8); backdrop-filter: blur(15px);
            height: 75px; display: flex; align-items: center; justify-content: space-between;
            padding: 0 20px; position: sticky; top: 0; z-index: 999; border-bottom: 1px solid rgba(0,0,0,0.05);
        }

        .btn-action {
            width: 45px; height: 45px; background: #fff; border: 1px solid #e2e8f0;
            border-radius: 15px; display: flex; align-items: center; justify-content: center;
            cursor: pointer; color: #1e293b; transition: 0.2s;
        }

        .sidebar-box {
            position: absolute; top: 85px; left: 20px; width: 220px;
            background: rgba(255, 255, 255, 0.95); border-radius: 20px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.1); display: none; z-index: 1001;
            animation: slideDown 0.3s ease; border: 1px solid rgba(255, 255, 255, 0.5); overflow: hidden;
        }

        .profile-box {
            position: absolute; top: 85px; right: 20px; width: 280px;
            background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(15px);
            border-radius: 25px; box-shadow: 0 15px 40px rgba(0,0,0,0.1);
            display: none; padding: 25px; z-index: 1001; animation: slideDown 0.3s ease;
        }

        .sidebar-title { padding: 15px 20px; font-size: 0.65rem; font-weight: 800; color: #94a3b8; text-transform: uppercase; border-bottom: 1px solid rgba(0,0,0,0.03); }
        .menu-item { padding: 12px 20px; display: flex; align-items: center; color: #475569; cursor: pointer; font-weight: 700; font-size: 0.85rem; }
        .menu-item:hover { background: rgba(0, 123, 255, 0.05); color: #007bff; }
        .menu-item i { margin-right: 12px; font-size: 0.9rem; width: 20px; text-align: center; }

        .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 20px; }
        .stat-card { background: white; padding: 20px 15px; border-radius: 25px; border: 1px solid #fff; text-align: center; }
        .stat-card h3 { margin: 5px 0; font-size: 1.4rem; color: #1e293b; letter-spacing: -1px; }
        .stat-card p { margin: 0; font-size: 0.6rem; font-weight: 800; color: #94a3b8; text-transform: uppercase; }

        .form-card { background: white; padding: 25px; border-radius: 30px; box-shadow: 0 10px 25px rgba(0,0,0,0.04); margin-top: 10px; display: none; border: 1px solid #fff; }
        .input-group label { display: block; font-size: 0.7rem; font-weight: 800; color: #64748b; text-transform: uppercase; margin-bottom: 8px; }
        .input-group input, .input-group textarea { width: 100%; padding: 15px; background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 18px; outline: none; margin-bottom: 15px; box-sizing: border-box; }
        
        .btn-flex { display: flex; gap: 10px; margin-top: 10px; }
        .btn-main { width: 100%; padding: 15px; background: #1a1a1a; color: white; border: none; border-radius: 18px; font-weight: 800; cursor: pointer; }
        
        .overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 1000; display: none; background: rgba(0,0,0,0.1); backdrop-filter: blur(2px); }
        .content { padding: 20px; max-width: 600px; margin: 0 auto; }

        /* History Card Style */
        .history-card { background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 20px; padding: 15px; margin-bottom: 15px; }
        .status-badge { display: inline-block; padding: 5px 12px; border-radius: 10px; font-size: 0.6rem; font-weight: 900; text-transform: uppercase; margin-bottom: 10px; }
        .status-pending { background: #fef9c3; color: #a16207; }
        .status-sukses { background: #dcfce7; color: #166534; }
        .status-batal { background: #fee2e2; color: #991b1b; }
        .history-img { width: 100%; border-radius: 12px; margin-top: 10px; border: 1px solid #e2e8f0; cursor: pointer; }

        .info-label { font-size: 0.6rem; font-weight: 800; color: #94a3b8; text-transform: uppercase; margin-top: 10px; display: block; }
        .info-value { font-size: 0.8rem; font-weight: 700; color: #1e293b; display: block; }
    </style>
</head>
<body>

    <div id="overlay" class="overlay" onclick="closeAll()"></div>

    <div class="header">
        <div class="btn-action" onclick="toggleSidebar()"><i class="fa-solid fa-screwdriver-wrench"></i></div>
        <div style="font-weight: 900; font-size: 1rem; letter-spacing: -1px;">admin panel</div>
        <div class="btn-action" onclick="toggleProfile()"><i class="fa-solid fa-user-shield"></i></div>
    </div>

    <div id="sidebar" class="sidebar-box">
        <div class="sidebar-title">admin menu</div>
        <div class="menu-item" onclick="showBC()"><i class="fa-solid fa-bullhorn"></i><span>kirim broadcast</span></div>
        <div class="menu-item" onclick="showIklanPage()"><i class="fa-solid fa-image"></i><span>manajemen iklan</span></div>
        <div class="menu-item" onclick="showHistoryTf()"><i class="fa-solid fa-receipt"></i><span>riwayat tf user</span></div>
        
        <div class="sidebar-title">manajemen user</div>
        <div class="menu-item" onclick="openPendingRequest()"><i class="fa-solid fa-clock-rotate-left"></i><span>request owner</span></div>
        <div class="menu-item" onclick="location.href='../user/dashboard.html'"><i class="fa-solid fa-eye"></i><span>login user</span></div>
    </div>

    <div id="profile-card" class="profile-box">
        <span class="info-label">admin :</span>
        <span class="info-value">super admin</span>
        <button class="btn-main" style="margin-top: 20px; background: #ef4444;" onclick="logout()">logout</button>
    </div>

    <div class="content">
        <div class="stats-grid">
            <div class="stat-card"><h3>0</h3><p>total user</p></div>
            <div class="stat-card"><h3 id="total-owner">0</h3><p>total owner</p></div>
        </div>

        <div id="history-tf-page" class="form-card">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                <div style="font-weight: 900; font-size: 0.9rem;">riwayat transfer user</div>
                <button onclick="hideHistoryTf()" style="background: #f1f5f9; border: none; width: 30px; height: 30px; border-radius: 8px;"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div id="list-history-tf"></div>
        </div>

        <div id="bc-form" class="form-card">
            <div class="input-group"><label>judul :</label><input type="text" id="bc-title"></div>
            <div class="input-group"><label>pesan :</label><textarea id="bc-msg" rows="4"></textarea></div>
            <div class="btn-flex">
                <button class="btn-main" onclick="sendBC()">kirim 🚀</button>
                <button onclick="hideBC()" class="btn-main" style="background:#94a3b8;">batal</button>
            </div>
        </div>

        <div id="iklan-page" class="form-card">
            <div class="input-group"><label>foto banner :</label><input type="file" id="foto-banner"></div>
            <div class="input-group"><label>judul :</label><input type="text" id="judul-banner"></div>
            <button class="btn-main" id="btn-upload-iklan" onclick="uploadIklan()">tambah iklan</button>
            <div id="list-iklan-container" style="margin-top: 20px;"></div>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDGRsCcT-7Bv_nOAybjXyuIT6Ca0IT4YTg",
            databaseURL: "https://market-d978f-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "market-d978f",
        };
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        function closeAll() {
            document.getElementById('sidebar').style.display = 'none';
            document.getElementById('profile-card').style.display = 'none';
            document.getElementById('overlay').style.display = 'none';
        }
        function toggleSidebar() { closeAll(); document.getElementById('sidebar').style.display = 'block'; document.getElementById('overlay').style.display = 'block'; }
        function toggleProfile() { closeAll(); document.getElementById('profile-card').style.display = 'block'; document.getElementById('overlay').style.display = 'block'; }
        
        function hideAllPages() {
            document.getElementById('history-tf-page').style.display = 'none';
            document.getElementById('bc-form').style.display = 'none';
            document.getElementById('iklan-page').style.display = 'none';
        }

        function showHistoryTf() { hideAllPages(); document.getElementById('history-tf-page').style.display = 'block'; loadHistoryTf(); closeAll(); }
        function hideHistoryTf() { document.getElementById('history-tf-page').style.display = 'none'; }
        
        function showBC() { hideAllPages(); document.getElementById('bc-form').style.display = 'block'; closeAll(); }
        function hideBC() { document.getElementById('bc-form').style.display = 'none'; }
        
        function showIklanPage() { hideAllPages(); document.getElementById('iklan-page').style.display = 'block'; loadIklanList(); closeAll(); }
        function hideIklanPage() { document.getElementById('iklan-page').style.display = 'none'; }

        // --- LOGIC: RIWAYAT TF USER ---
        function loadHistoryTf() {
            const container = document.getElementById('list-history-tf');
            db.ref('deposit_history').on('value', (snap) => {
                container.innerHTML = "";
                if (!snap.exists()) return container.innerHTML = "<p style='text-align:center; color:#94a3b8;'>kosong</p>";
                
                snap.forEach((child) => {
                    const data = child.val();
                    const key = child.key;
                    const statusClass = `status-${data.status.replace(' admin', '')}`;
                    
                    let actionButtons = "";
                    if (data.status === "pending admin" || data.status === "pending") {
                        actionButtons = `
                            <div class="btn-flex">
                                <button onclick="prosesDeposit('${key}', '${data.userToken}', ${data.amount}, '${data.ref}', 'terima')" style="flex:1; padding:10px; border-radius:12px; border:none; background:#dcfce7; color:#166534; font-weight:800; cursor:pointer;">TERIMA</button>
                                <button onclick="prosesDeposit('${key}', '${data.userToken}', ${data.amount}, '${data.ref}', 'batal')" style="flex:1; padding:10px; border-radius:12px; border:none; background:#fee2e2; color:#991b1b; font-weight:800; cursor:pointer;">BATAL</button>
                            </div>
                        `;
                    }

                    container.innerHTML += `
                        <div class="history-card">
                            <span class="status-badge ${statusClass}">${data.status}</span>
                            <div style="display:grid; grid-template-columns:1fr 1fr;">
                                <div><span class="info-label">USER :</span><span class="info-value">${data.username || 'user'}</span></div>
                                <div><span class="info-label">NOMINAL :</span><span class="info-value">rp ${data.amount.toLocaleString()}</span></div>
                            </div>
                            <span class="info-label">ID REF :</span><span class="info-value">${data.ref}</span>
                            <img src="${data.image}" class="history-img" onclick="window.open('${data.image}')">
                            ${actionButtons}
                        </div>
                    `;
                });
            });
        }

        async function prosesDeposit(key, userToken, amount, ref, action) {
            if (!confirm(`Apakah Anda yakin ingin ${action} deposit ini?`)) return;
            
            try {
                if (action === 'terima') {
                    const userRef = db.ref('users/' + userToken);
                    const userSnap = await userRef.once('value');
                    if (userSnap.exists()) {
                        const currentBalance = userSnap.val().balance || 0;
                        await userRef.update({ balance: currentBalance + amount });
                        await db.ref('deposit_history/' + key).update({ status: 'sukses' });
                        alert("Deposit Diterima! Saldo user bertambah.");
                    }
                } else {
                    await db.ref('deposit_history/' + key).update({ status: 'batal' });
                    // Hapus dari used_receipts agar user bisa coba lagi jika memang salah upload
                    await db.ref('used_receipts/' + ref).remove();
                    alert("Deposit Dibatalkan.");
                }
            } catch (e) { alert("Gagal memproses."); }
        }

        // --- LOGIC LAIN ---
        async function sendBC() {
            const title = document.getElementById('bc-title').value;
            const message = document.getElementById('bc-msg').value;
            await db.ref('broadcast').set({ title, message });
            alert("Broadcast Meluncur!");
        }

        function logout() { localStorage.clear(); location.href = "../login.html"; }
    </script>
</body>
</html>
