<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>admin | rekap owner 😼</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        body { 
            background: #f0f4f8; color: #1a1a1a; font-family: 'inter', sans-serif; 
            margin: 0; padding: 20px; text-transform: lowercase;
        }
        .container { max-width: 500px; margin: 0 auto; }
        .header { display: flex; align-items: center; gap: 15px; margin-bottom: 25px; }
        .btn-back { width: 40px; height: 40px; border-radius: 12px; border: 1px solid #e2e8f0; display: flex; align-items: center; justify-content: center; color: #1a1a1a; text-decoration: none; background: white; }
        
        .list-rekap { display: flex; flex-direction: column; gap: 10px; }
        .card-rekap {
            background: white; padding: 18px 22px; border-radius: 20px;
            display: flex; justify-content: space-between; align-items: center;
            box-shadow: 0 5px 15px rgba(0,0,0,0.02);
            border: 1px solid #fff;
        }
        .owner-name { font-weight: 800; color: #1e293b; font-size: 0.9rem; display: flex; align-items: center; gap: 10px; }
        .owner-name i { color: #007bff; font-size: 0.8rem; }
        
        .total-amount { font-weight: 900; color: #15803d; font-size: 0.95rem; }
        
        #loader { text-align: center; padding: 40px; color: #007bff; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <a href="dashboard.html" class="btn-back"><i class="fa-solid fa-arrow-left"></i></a>
        <h2 style="font-size: 1rem; margin: 0; font-weight: 900;">rekap penjualan owner 😼</h2>
    </div>

    <div id="loader"><i class="fa-solid fa-circle-notch fa-spin fa-2x"></i></div>
    <div class="list-rekap" id="rekap-container"></div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>

<script>
    const firebaseconfig = {
        apiKey: "AIzaSyDGRsCcT-7Bv_nOAybjXyuIT6Ca0IT4YTg",
        databaseURL: "https://market-d978f-default-rtdb.asia-southeast1.firebasedatabase.app",
        projectId: "market-d978f",
    };
    if (!firebase.apps.length) firebase.initializeApp(firebaseconfig);
    const db = firebase.database();

    async function hitungRekapOwner() {
        try {
            // Ambil semua transaksi yang sukses
            const snapshot = await db.ref('transactions').orderByChild('status').equalTo('success').once('value');
            const container = document.getElementById('rekap-container');
            document.getElementById('loader').style.display = 'none';

            if (!snapshot.exists()) {
                container.innerHTML = '<p style="text-align:center; color:#94a3b8; font-weight:700;">belum ada data penjualan.</p>';
                return;
            }

            let rekap = {}; // Tempat nampung { "namaowner": total }

            snapshot.forEach(child => {
                const data = child.val();
                const nama = data.ownerName || "tanpa nama";
                const nominal = parseInt(data.totalHarga || 0);

                // Abaikan jika itu admin pusat
                if (nama === "TERTINGGI DI WEBSITE INI 😼") return;

                if (!rekap[nama]) {
                    rekap[nama] = 0;
                }
                rekap[nama] += nominal;
            });

            // Render ke HTML
            container.innerHTML = "";
            for (const [nama, total] of Object.entries(rekap)) {
                container.innerHTML += `
                    <div class="card-rekap">
                        <div class="owner-name">
                            <i class="fa-solid fa-store"></i>
                            ${nama}
                        </div>
                        <div class="total-amount">rp ${total.toLocaleString('id-ID')}</div>
                    </div>
                `;
            }

        } catch (error) {
            console.error(error);
            document.getElementById('loader').innerHTML = "error memuat data.";
        }
    }

    window.onload = hitungRekapOwner;
</script>
</body>
</html>
